<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="iceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#082f49" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Ice Cube Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#iceGrad)" stroke="#bae6fd" stroke-width="2.5" filter="url(#iceShadow)"/>
  
  <!-- Frost Sheen Highlights -->
  <path d="M 6 18 C 6 10, 10 6, 18 6 L 46 6 C 54 6, 58 10, 58 18 C 54 13, 40 10, 32 10 C 20 10, 8 13, 6 18 Z" fill="#ffffff" opacity="0.45"/>
  <circle cx="14" cy="14" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="20" cy="11" r="1.2" fill="#ffffff" opacity="0.5"/>
  
  <!-- Symmetrical 6-Branch Ice Crystal / Snowflake -->
  <g stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main 6 axis lines -->
    <line x1="32" y1="13" x2="32" y2="51"/>
    <line x1="15.5" y1="22.5" x2="48.5" y2="41.5"/>
    <line x1="15.5" y1="41.5" x2="48.5" y2="22.5"/>
    
    <!-- Top & Bottom Arrows -->
    <path d="M 28 19 L 32 23 L 36 19"/>
    <path d="M 28 45 L 32 41 L 36 45"/>
    <path d="M 29.5 15.5 L 32 13.5 L 34.5 15.5"/>
    <path d="M 29.5 48.5 L 32 50.5 L 34.5 48.5"/>
    
    <!-- Diagonal Arrows -->
    <path d="M 21 21 L 24 24.5 L 21 28"/>
    <path d="M 43 36 L 40 39.5 L 43 43"/>
    <path d="M 21 43 L 24 39.5 L 21 36"/>
    <path d="M 43 28 L 40 24.5 L 43 21"/>
  </g>
  
  <!-- Core Frozen Crystal Center -->
  <circle cx="32" cy="32" r="3.6" fill="#ffffff"/>
  <circle cx="32" cy="32" r="1.8" fill="#0284c7"/>
</svg>

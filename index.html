        // ==================== ADMIN FUNCTIONS ====================
        async function downloadDatabaseJSON() {
            if (!isAdmin()) {
                showToast('⚠️ Hanya admin yang dapat mengunduh backup.', 'critical');
                return;
            }
            try {
                showToast('⏳ Mengambil data dari server...');
                // Ambil data absolute terbaru langsung dari server Firebase
                const doc = await db.collection('shared').doc('data').get();
                if (!doc.exists) {
                    showToast('❌ Data tidak ditemukan di server.', 'critical');
                    return;
                }
                
                const data = doc.data();
                // Ubah data menjadi JSON dengan format rapi (indentasi 2 spasi)
                const jsonStr = JSON.stringify(data, null, 2);
                
                // Buat file Blob
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                // Pancing proses download di browser
                const a = document.createElement('a');
                a.href = url;
                const dateStr = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
                a.download = `Backup_WalkIn_Gudang_${dateStr}.json`;
                document.body.appendChild(a);
                a.click();
                
                // Bersihkan sampah memori
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                showToast('✅ Backup JSON berhasil diunduh!');
            } catch (err) {
                console.error('Backup error:', err);
                showToast('❌ Gagal mengunduh backup: ' + err.message, 'critical');
            }
        }

        async function restoreDatabaseJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Peringatan keras karena ini akan menimpa database live!
            const msg = `⚠️ PERINGATAN BAHAYA!\n\nAnda akan menimpa seluruh Denah & Keranjang Gudang yang ada saat ini dengan data dari file:\n"${file.name}"\n\nApakah Anda YAKIN ingin melakukan RESTORE?`;
            
            if (!confirm(msg)) {
                event.target.value = ''; // Reset input file jika batal
                return;
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    // Validasi basic apakah ini file JSON walk-in gudang kita
                    if (!data.frozen || !data.chiller) {
                        showToast('❌ Gagal: Format file JSON tidak dikenali.', 'critical');
                        event.target.value = '';
                        return;
                    }
                    
                    showToast('⏳ Sedang memulihkan database...', 'normal');
                    
                    // Timpa data di Firebase dengan data dari file JSON
                    // Kita naikkan versinya agar perangkat lain otomatis me-refresh layarnya
                    data.version = (state.serverVersion || 0) + 1;
                    data.lastSync = firebase.firestore.FieldValue.serverTimestamp();
                    
                    await db.collection('shared').doc('data').set(data);
                    
                    showToast('✅ Database berhasil dipulihkan dari Backup!');
                    event.target.value = ''; // Reset input
                    
                    // Refresh layar
                    setTimeout(() => renderCurrentTab(), 1000);
                    
                } catch (error) {
                    console.error("Restore Error:", error);
                    showToast('❌ Gagal membaca atau memulihkan file JSON.', 'critical');
                    event.target.value = '';
                }
            };
            
            reader.readAsText(file);
        }

        async function migrateDatabase() {
            if (!isAdmin()) return showToast('Hanya admin', 'critical');
            if (!confirm('🚀 Pindahkan semua riwayat lama ke format baru tanpa batas 1MB?\n\n(Pastikan Anda sudah mendownload Backup JSON)')) return;
            
            try {
                showToast('⏳ Membaca data lama...', 'normal');
                const doc = await db.collection('shared').doc('data').get();
                const data = doc.data();
                
                const frozenTxns = data.frozen?.transactions || [];
                const chillerTxns = data.chiller?.transactions || [];
                
                const allTxns = [
                    ...frozenTxns.map(t => ({...t, area: 'frozen'})),
                    ...chillerTxns.map(t => ({...t, area: 'chiller'}))
                ];

                if (allTxns.length === 0) return showToast('✅ Tidak ada data lama. Aplikasi sudah versi terbaru!');

                showToast(`⏳ Memindahkan ${allTxns.length} riwayat... JANGAN TUTUP HALAMAN INI`, 'normal');
                
                // Pindahkan data secara mencicil (batch) 400 data per putaran
                for (let i = 0; i < allTxns.length; i += 400) {
                    const chunk = allTxns.slice(i, i + 400);
                    const batch = db.batch();
                    
                    chunk.forEach(txn => {
                        const ref = db.collection('transactions').doc(txn.id || Utils.uid());
                        batch.set(ref, txn);
                    });
                    
                    // Di putaran terakhir, hapus beban array dari dokumen utama
                    if (i + 400 >= allTxns.length) {
                        const newData = { ...data };
                        if (newData.frozen) newData.frozen.transactions = [];
                        if (newData.chiller) newData.chiller.transactions = [];
                        batch.set(db.collection('shared').doc('data'), newData);
                    }
                    await batch.commit();
                }
                showToast('✅ UPGRADE SUKSES! Limit 1MB resmi dihilangkan.');
            } catch (err) {
                console.error(err);
                showToast('❌ Gagal: ' + err.message, 'critical');
            }
        }
        
        async function resetAllData() {
            if (!isAdmin()) {
                showToast('⚠️ Hanya admin yang dapat mereset data.', 'critical');
                return;
            }
            if (!confirm('⚠️ Hapus SEMUA data? Tindakan ini tidak dapat dibatalkan.')) return;
            if (!confirm('⚠️ Konfirmasi: Data akan hilang permanen. Yakin?')) return;
            
            try {
                await db.collection('shared').doc('data').set({
                    frozen: {
                        sections: getDefaultSections('frozen'),
                        baskets: {},
                        transactions: []
                    },
                    chiller: {
                        sections: getDefaultSections('chiller'),
                        baskets: {},
                        transactions: []
                    }
                });
                showToast('✅ Data direset.');
                renderCurrentTab();
            } catch (err) {
                console.error('Reset error:', err);
                showToast('❌ Gagal mereset data.', 'critical');
            }
        }
        
        // ==================== NAVIGATION ====================
        function switchArea() {
            state.currentArea = DOM.areaSelect.value;
            DOM.areaTitle.textContent = state.currentArea === 'frozen' ? 'Frozen' : 'Chiller';
            renderCurrentTab();
        }
        
        function renderCurrentTab() {
            try {
                switch (state.currentTab) {
                    case 'dashboard': renderDashboard(); break;
                    case 'in': renderInputForm(); break;
                    case 'search': renderSearch(); break;
                    case 'history': renderHistory(); break;
                    case 'rekap': renderRekap(); break;
                    case 'reminder': renderReminder(); break;
                    case 'manage': renderManageBaskets(); break;
                    default: renderDashboard();
                }
            } catch (err) {
                console.error('Render error:', err);
                DOM.container.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <i class="fas fa-exclamation-triangle" style="color:var(--warning);" aria-hidden="true"></i>
                            <p>Terjadi error. Silakan refresh halaman.</p>
                            <button class="btn btn-sm btn-outline" onclick="location.reload()">Refresh</button>
                        </div>
                    </div>
                `;
            }
        }

        // ==================== SEARCH BRIDGE ====================
    function searchByStatus(status) {
        state.currentTab = 'search';
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
            btn.setAttribute('aria-selected', 'false');
        });
        const searchBtn = document.querySelector('.tab-btn[data-tab="search"]');
        if (searchBtn) {
            searchBtn.classList.add('active');
            searchBtn.setAttribute('aria-selected', 'true');
        }
        renderSearch();
        setTimeout(() => {
            const statusSelect = document.getElementById('searchStatus');
            const searchInput = document.getElementById('searchInput');
            if (statusSelect) statusSelect.value = status;
            if (searchInput) searchInput.value = '';
            performSearch();
        }, 100);
    }
        // ==================== INIT ====================
        function init() {
            // Cache DOM elements
            DOM.loginScreen = document.getElementById('loginScreen');
            DOM.appScreen = document.getElementById('appScreen');
            DOM.container = document.getElementById('appContainer');
            DOM.toast = document.getElementById('toast');
            DOM.areaSelect = document.getElementById('areaSelect');
            DOM.areaTitle = document.getElementById('areaTitle');
            DOM.currentUserName = document.getElementById('currentUserName');
            DOM.loginError = document.getElementById('loginError');
            DOM.loginEmail = document.getElementById('loginEmail');
            DOM.loginPassword = document.getElementById('loginPassword');
            
            // Initialize
            initFirebase();
            setupAuthListener();
            
            // Tab navigation with accessibility
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                    });
                    this.classList.add('active');
                    this.setAttribute('aria-selected', 'true');
                    state.currentTab = this.dataset.tab;
                    renderCurrentTab();
                });
                
                // Keyboard navigation
                btn.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        btn.click();
                    }
                });
            });
            
            // Set initial area
            DOM.areaSelect.value = state.currentArea;

            // Global Escape key to dismiss modals
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeUnauthorizedDomainModal();
                    closeFaviconGuideModal();
                }
            });
        }
        
        // Expose public API
        return {
            init, login, loginWithGoogle, logout, switchArea, renderDashboard,
            showBasketDetail, quickAddToBasket, submitQuickAdd, validateQuickEstOut,
            editEstOutDate, saveEstDate, renderMoveForm, updateMoveSectionByArea,
            updateMoveBaris, updateMoveSlot, handleMoveSlotChange, pindahkanItem, validateMoveKeranjangBaru,
            keluarkanItem, closePartialOutDialog, executePartialOut, 
            showMoveBasketForm, updateMoveBasketBaris, updateMoveBasketSlot, executeMoveBasket,
            renderInputForm, handleSlotChange, validateKeranjangNumber, validateEstOutDate,
            updateBarisSelect, updateSlotSelect, updateNamaDatalist, submitIn,
            renderSearch, debouncedSearch, performSearch, navigateToBasket,
            renderHistory, showExportHistoryModal, downloadExcel, renderRekap, setRekapMode,
            downloadRekapExcel, renderReminder, copyUserReminderByKey, copyAllReminders,
            exportReminderCSV, navigateToBasketFromReminder, renderManageBaskets,
            clearSlot, fillSlot, addBaris, toggleRetainSample,
            downloadDatabaseJSON, migrateDatabase, resetAllData, searchByStatus,
            restoreDatabaseJSON,
            showUnauthorizedDomainModal, closeUnauthorizedDomainModal, copyDomainToClipboard,
            showFaviconGuideModal, closeFaviconGuideModal, copyFaviconSnippet, downloadFaviconSvg,
            generateWebQRCode, downloadWebQRCode, shareWebQRCode, copyWebLink
        };
    })();
    
    // Start app when DOM ready
    document.addEventListener('DOMContentLoaded', App.init);
    </script>

    <!-- Chatbot Widget -->
    <div class="chat-widget">
        <button class="chat-btn" id="chatBtn" aria-label="Buka Chatbot">
            <i class="fas fa-comment-dots"></i>
        </button>
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <span>R&D Assistant AI</span>
                <button class="chat-close" id="chatClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="chat-body" id="chatBody">
                <div class="chat-msg ai">Hi Team R&D, ada yang bisa saya bantu hari ini?</div>
                <div class="chat-typing" id="chatTyping">AI sedang mengetik...</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" class="chat-input" placeholder="Ketik pesan..." aria-label="Pesan">
                <button class="chat-send" id="chatSend" aria-label="Kirim"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const chatBtn = document.getElementById('chatBtn');
        const chatWindow = document.getElementById('chatWindow');
        const chatClose = document.getElementById('chatClose');
        const chatBody = document.getElementById('chatBody');
        const chatInput = document.getElementById('chatInput');
        const chatSend = document.getElementById('chatSend');
        const chatTyping = document.getElementById('chatTyping');
        
        let chatHistory = [];
        const chatCache = new Map();
        
        // Daftar FAQ Cepat (Client-side)
        const FAQ_TEMPLATES = [
            {
                keywords: ["menu", "fungsi menu", "ada menu apa saja", "tab navigasi", "fitur"],
                answer: "Hi Team R&D,\n\nBerikut adalah fungsi menu pada aplikasi Walk-in:\n1. **Denah**: Melihat tata letak gudang (Frozen/Chiller) dan isi keranjang secara visual.\n2. **Masuk**: Memasukkan barang baru ke dalam keranjang di gudang.\n3. **Cari**: Mencari lokasi spesifik dari sebuah barang.\n4. **Riwayat**: Melihat catatan aktivitas barang masuk, keluar, atau pindah.\n5. **Rekap**: Melihat laporan ringkas pergerakan barang (harian/bulanan).\n6. **Reminder**: Menampilkan notifikasi barang yang akan atau sudah kedaluwarsa.\n7. **Pengaturan**: Mengelola data atau pengaturan lainnya (jika memiliki akses)."
            },
            {
                keywords: ["tanda notifikasi", "badge", "warna", "arti warna", "tanda merah", "tanda kuning", "tanda hijau", "status barang", "indikator"],
                answer: "Hi Team R&D,\n\nBerikut adalah arti warna dan tanda status pada keranjang/barang:\n- **Hijau (Aktif/Masuk)**: Barang dalam kondisi baik dan aman digunakan.\n- **Kuning/Orange (EST Lewat)**: Barang akan segera mendekati masa kedaluwarsa atau batas EST.\n- **Merah (Expired/Penuh)**: Barang sudah kedaluwarsa atau keranjang sudah penuh.\n- **Ungu (Pindah/Retain)**: Menandakan barang yang dipindahkan atau sampel retain."
            },
            {
                keywords: ["apa itu", "tentang aplikasi", "walk-in", "fungsi aplikasi", "kegunaan"],
                answer: "Hi Team R&D,\n\nAplikasi **Walk-in Frozen & Chiller | v2.0** adalah sistem manajemen inventaris gudang yang dirancang untuk mempermudah pemantauan stok barang. Anda dapat melacak posisi barang di dalam rak, menginput barang masuk, mengeluarkan barang, memindahkan stok, serta mendapatkan notifikasi untuk barang yang sudah kedaluwarsa."
            },
            {
                keywords: ["login", "masuk", "cara login", "sign in", "lupa password"],
                answer: "Hi Team R&D,\n\nUntuk masuk (login) ke aplikasi Walk-in, silakan ikuti langkah berikut:\n1. Buka halaman depan aplikasi.\n2. Masukkan **Email HokBen** Anda.\n3. Masukkan **Password**.\n4. Klik tombol **Masuk**."
            },
            {
                keywords: ["keluar", "logout", "cara keluar", "sign out"],
                answer: "Hi Team R&D,\n\nUntuk keluar dari aplikasi, silakan klik tombol **Keluar** yang berada di pojok kanan atas layar (tepat di sebelah nama/email Anda)."
            },
            {
                keywords: ["denah", "peta", "lokasi barang", "mencari barang", "cari barang", "dimana"],
                answer: "Hi Team R&D,\n\nUntuk mencari lokasi barang:\n1. Gunakan menu **Denah** untuk melihat tata letak gudang (Frozen/Chiller) dan status isi tiap keranjang secara visual.\n2. Atau, gunakan menu **Cari** dan ketikkan nama barang untuk menemukan lokasinya dengan cepat."
            },
            {
                keywords: ["tambah barang", "barang masuk", "input barang", "masukin barang"],
                answer: "Hi Team R&D,\n\nCara memasukkan barang ke sistem:\n1. Buka tab **Masuk**.\n2. Pilih area (Frozen/Chiller), lalu pilih Rak & Keranjang tujuan.\n3. Isi nama barang, jumlah, dan tanggal kedaluwarsa (EST/ED).\n4. Klik simpan."
            },
            {
                keywords: ["barang keluar", "ambil barang", "keluarin barang"],
                answer: "Hi Team R&D,\n\nCara mengeluarkan barang:\n1. Cari barangnya di menu **Denah** atau **Cari**.\n2. Klik tombol merah bergambar panah keluar (**Out**).\n3. Masukkan jumlah barang yang akan diambil.\n4. Konfirmasi."
            },
            {
                keywords: ["pindah barang", "pindahkan", "geser barang", "mutasi"],
                answer: "Hi Team R&D,\n\nCara memindahkan barang antar keranjang:\n1. Cari barang di **Denah** atau **Cari**.\n2. Klik tombol ungu bergambar panah putar (**Move**).\n3. Pilih rak dan keranjang tujuan yang baru, lalu konfirmasi."
            },
            {
                keywords: ["rekap", "laporan", "statistik"],
                answer: "Hi Team R&D,\n\nAnda bisa melihat ringkasan aktivitas di menu **Rekap**. Di sana terdapat data total barang masuk, keluar, serta pergerakan harian maupun bulanan."
            },
            {
                keywords: ["reminder", "pengingat", "expired", "kedaluwarsa", "basi"],
                answer: "Hi Team R&D,\n\nSilakan cek menu **Reminder**. Menu ini akan menampilkan daftar barang yang sudah melewati batas waktu kedaluwarsa atau EST, agar Anda bisa segera melakukan tindakan."
            },
            {
                keywords: ["halo", "hai", "hi", "pagi", "siang", "sore", "malam", "ping", "test"],
                answer: "Hi Team R&D! Saya adalah asisten AI Walk-in. Ada yang bisa saya bantu terkait aplikasi ini? Anda bisa menanyakan cara login, cari barang, input barang masuk/keluar, dan lainnya."
            }
        ];

        function toggleChat() {
            chatWindow.classList.toggle('open');
            if (chatWindow.classList.contains('open')) {
                chatInput.focus();
            }
        }

        chatBtn.addEventListener('click', toggleChat);
        chatClose.addEventListener('click', toggleChat);

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        chatSend.addEventListener('click', sendMessage);

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';
            chatSend.disabled = true;

            const lowerText = text.toLowerCase();
            
            // 1. Cek FAQ Client-side untuk respons instan
            let matchedFaq = null;
            for (const faq of FAQ_TEMPLATES) {
                if (faq.keywords.some(kw => lowerText.includes(kw))) {
                    matchedFaq = faq.answer;
                    break;
                }
            }

            if (matchedFaq) {
                addMessage(matchedFaq, 'ai');
                chatSend.disabled = false;
                return;
            }

            // 2. Cek Cache In-Memory
            if (chatCache.has(lowerText)) {
                addMessage(chatCache.get(lowerText), 'ai');
                chatSend.disabled = false;
                return;
            }

            // 3. Fallback ke API (Gemini) jika tidak ada di FAQ atau Cache
            chatTyping.classList.add('active');
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory, message: text })
                });
                
                const data = await response.json();
                chatTyping.classList.remove('active');
                
                if (response.ok) {
                    addMessage(data.text, 'ai');
                    chatHistory.push({ role: 'user', text });
                    chatHistory.push({ role: 'model', text: data.text });
                    
                    // Simpan ke cache
                    chatCache.set(lowerText, data.text);
                } else {
                    addMessage('Maaf, terjadi kesalahan saat menghubungi AI: ' + (data.error || 'Unknown error'), 'ai');
                }
            } catch (err) {
                chatTyping.classList.remove('active');
                addMessage('Gagal terhubung ke server AI.', 'ai');
            }
            chatSend.disabled = false;
        }

        function formatChatText(text) {
            // Escape HTML to prevent XSS
            const div = document.createElement('div');
            div.textContent = text;
            let escaped = div.innerHTML;

            // Format Bold: **teks** menjadi <strong>teks</strong>
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Format Italic: *teks* menjadi <em>teks</em>
            escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // Format Bullet points: * teks menjadi <li>teks</li>
            // Sederhananya, ganti baris baru dengan <br>
            escaped = escaped.replace(/\n/g, '<br>');

            return escaped;
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-msg ' + sender;
            
            if (sender === 'ai') {
                msgDiv.innerHTML = formatChatText(text);
            } else {
                msgDiv.textContent = text;
            }
            
            chatBody.insertBefore(msgDiv, chatTyping);
            chatBody.scrollTop = chatBody.scrollHeight;
        }
    </script>

        function updateMoveBasketBaris() {
            const section = document.getElementById('moveBasketSection')?.value;
            const barisSelect = document.getElementById('moveBasketBaris');
            if (!barisSelect) return;
            
            barisSelect.innerHTML = '<option value="">-- Pilih Baris --</option>';
            if (!section) return;
            
            const barisObj = currentSections()[section] || {};
            Object.keys(barisObj).sort().forEach((barisName, idx) => {
                const paddedIdx = String(idx + 1).padStart(2, '0');
                const label = `${section} ${paddedIdx}`;
                barisSelect.innerHTML += `<option value="${Utils.escapeHtml(barisName)}">${Utils.escapeHtml(label)}</option>`;
            });
            
            document.getElementById('moveBasketSlot').innerHTML = '<option value="">-- Pilih Slot --</option>';
        }
        
        function updateMoveBasketSlot() {
            const section = document.getElementById('moveBasketSection')?.value;
            const baris = document.getElementById('moveBasketBaris')?.value;
            const slotSelect = document.getElementById('moveBasketSlot');
            if (!slotSelect) return;
            
            slotSelect.innerHTML = '<option value="">-- Pilih Slot --</option>';
            if (!section || !baris) return;
            
            const slots = currentSections()[section]?.[baris] || [];
            for (let i = 0; i < 5; i++) {
                const basketNum = slots[i];
                const slotNum = i + 1;
                if (basketNum === null) {
                    slotSelect.innerHTML += `<option value="${slotNum}">Slot ${slotNum} (kosong) ✅</option>`;
                } else {
                    slotSelect.innerHTML += `<option value="${slotNum}" disabled>Slot ${slotNum}: ${basketNum} ❌</option>`;
                }
            }
        }
        
        async function executeMoveBasket(basketNum) {
            const targetSection = document.getElementById('moveBasketSection')?.value;
            const targetBaris = document.getElementById('moveBasketBaris')?.value;
            const targetSlot = parseInt(document.getElementById('moveBasketSlot')?.value);
            
            if (!targetSection || !targetBaris || !targetSlot) {
                return showToast('Lengkapi Section, Baris, dan Slot tujuan!', 'critical');
            }
            
            const basket = currentBaskets()[basketNum];
            if (!basket) return;
            
            // Check if same location
            if (basket.section === targetSection && basket.baris === targetBaris && basket.slot === targetSlot) {
                return showToast('Lokasi tujuan sama dengan saat ini!', 'critical');
            }
            
            const targetSlots = currentSections()[targetSection]?.[targetBaris];
            if (!targetSlots) return;
            if (targetSlots[targetSlot - 1] !== null) {
                return showToast('Slot tujuan sudah terisi!', 'critical');
            }
            
            // Update source slot to empty
            const fromSection = basket.section;
            const fromBaris = basket.baris;
            const fromSlot = basket.slot;
            const fromSlots = currentSections()[fromSection]?.[fromBaris];
            if (fromSlots) {
                fromSlots[fromSlot - 1] = null;
            }
            
            // Update target slot
            targetSlots[targetSlot - 1] = basketNum;
            
            // Update basket metadata
            basket.section = targetSection;
            basket.baris = targetBaris;
            basket.slot = targetSlot;
            
            logTransaction('move', {
                nama: `[KERANJANG ${basketNum}]`,
                qty: `${basket.items.length} item`,
                jenis: 'KERANJANG',
                dari: `${fromSection} ${fromBaris} Slot ${fromSlot}`,
                ke: `${targetSection} ${targetBaris} Slot ${targetSlot}`,
                keranjang: basketNum,
                section: targetSection
            });
            
            try {
                await saveToFirestore();
                showToast(`✅ Keranjang ${basketNum} dipindahkan!`);
                setTimeout(() => showBasketDetail(basketNum), 500);
            } catch {
                // Error handled
            }
        }
        
        // ==================== INPUT FORM ====================
        function renderInputForm() {
            const sectionOptions = Object.keys(currentSections())
                .map(s => `<option value="${Utils.escapeHtml(s)}">${Utils.escapeHtml(s)}</option>`)

        function handleSlotChange() {
            const slot = parseInt(document.getElementById('inSlot')?.value);
            const manualInput = document.getElementById('inKeranjangManual');
            const formGroup = manualInput?.closest('.form-group');
            if (!manualInput) return;
            
            // Clear previous warnings
            const existingWarning = document.getElementById('keranjangWarning');
            if (existingWarning) existingWarning.remove();
            manualInput.classList.remove('input-warning', 'input-success');
            
            if (!slot || isNaN(slot)) {
                manualInput.disabled = true;
                manualInput.placeholder = "Pilih slot dulu";
                return;
            }
            
            const section = document.getElementById('inSection')?.value;
            const baris = document.getElementById('inBaris')?.value;
            const slots = currentSections()[section]?.[baris];
            if (!slots) return;
            
            const basketNum = slots[slot - 1];
            if (basketNum !== null && basketNum !== undefined) {
                // Slot already has a basket
                manualInput.disabled = true;
                manualInput.value = '';
                manualInput.placeholder = `Menggunakan keranjang ${basketNum}`;
                manualInput.classList.add('input-success');
                
                const count = itemCount(basketNum);
                const cap = getBasketCapacity(basketNum);
                const info = document.createElement('div');
                info.id = 'keranjangWarning';
                info.className = 'success-message';
                info.innerHTML = `<i class="fas fa-check-circle" aria-hidden="true"></i> Keranjang ${basketNum} tersedia (${count}/${cap} item)`;
                info.setAttribute('role', 'status');
                formGroup?.appendChild(info);
            } else {
                // Empty slot - need new basket number
                manualInput.disabled = false;
                manualInput.placeholder = "⚠️ Masukkan nomor keranjang baru (wajib)";
                manualInput.classList.add('input-warning');
                manualInput.focus();
                
                // Attach validation handler
                manualInput.oninput = function() {
                    validateKeranjangNumber(this.value);
                };
            }
        }
        
        function validateKeranjangNumber(value) {
            const input = document.getElementById('inKeranjangManual');
            const formGroup = input?.closest('.form-group');
            const warning = document.getElementById('keranjangWarning');
            if (warning) warning.remove();
            
            if (!value || isNaN(parseInt(value)) || parseInt(value) <= 0) {
                input?.classList.add('input-warning');
                input?.classList.remove('input-success');
                return;
            }
            
            const num = parseInt(value);
            let found = null;
            const area = state.currentArea; // <--- HANYA CEK AREA SAAT INI
            
            const sections = state.appData[area].sections;
            for (const [secName, barisObj] of Object.entries(sections)) {
                for (const [barisName, slots] of Object.entries(barisObj)) {
                    if (slots.includes(num)) {
                        const slotIdx = slots.indexOf(num) + 1;
                        found = { area, section: secName, baris: barisName, slot: slotIdx };
                        break;
                    }
                }
                if (found) break;
            }
            
            if (found) {
                input?.classList.add('input-warning');
                input?.classList.remove('input-success');
                const warn = document.createElement('div');
                warn.id = 'keranjangWarning';
                warn.className = 'warning-message';
                warn.setAttribute('role', 'alert');
                warn.innerHTML = `<i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ❌ Nomor ${num} sudah digunakan di ${found.area==='frozen'?'❄️ Frozen':'🌡️ Chiller'} (${found.section} Baris ${found.baris} Slot ${found.slot})`;
                formGroup?.appendChild(warn);
            } else {
                input?.classList.add('input-success');
                input?.classList.remove('input-warning');
                const success = document.createElement('div');
                success.id = 'keranjangWarning';
                success.className = 'success-message';
                success.setAttribute('role', 'status');
                success.innerHTML = `<i class="fas fa-check-circle" aria-hidden="true"></i> ✅ Nomor ${num} tersedia`;
                formGroup?.appendChild(success);
            }
        }
        
        function validateEstOutDate() {
            const expDate = document.getElementById('inExpDate')?.value;
            const estOut = document.getElementById('inEstOutDate')?.value;
            const estInput = document.getElementById('inEstOutDate');
            const formGroup = estInput?.closest('.form-group');
            const warning = document.getElementById('estOutWarning');
            if (warning) warning.remove();
            estInput?.classList.remove('input-warning', 'input-success');
            
            if (!expDate || !estOut) return;
            
            const expD = Utils.parseDate(expDate);
            const estD = Utils.parseDate(estOut);
            if (!expD || !estD) return;
            
            if (estD > expD) {
                estInput?.classList.add('input-warning');
                const warn = document.createElement('div');
                warn.id = 'estOutWarning';
                warn.className = 'warning-message';
                warn.setAttribute('role', 'alert');
                warn.innerHTML = `<i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ❌ Estimasi Keluar (${estOut}) tidak boleh lebih dari Tanggal Exp (${expDate})`;
                formGroup?.appendChild(warn);
            } else if (estD.getTime() === expD.getTime()) {
                estInput?.classList.add('input-success');
                const info = document.createElement('div');
                info.id = 'estOutWarning';
                info.className = 'success-message';
                info.setAttribute('role', 'status');
                info.innerHTML = '<i class="fas fa-info-circle" aria-hidden="true"></i> ⚠️ Estimasi Keluar sama dengan Tanggal Exp';
                formGroup?.appendChild(info);
            } else {
                estInput?.classList.add('input-success');
                const success = document.createElement('div');
                success.id = 'estOutWarning';
                success.className = 'success-message';
                success.setAttribute('role', 'status');
                success.innerHTML = '<i class="fas fa-check-circle" aria-hidden="true"></i> ✅ Estimasi Keluar valid (sebelum Exp)';
                formGroup?.appendChild(success);
            }
        }
        
        function updateBarisSelect() {
            const section = document.getElementById('inSection')?.value;
            const barisSelect = document.getElementById('inBaris');
            if (!barisSelect) return;
            
            barisSelect.innerHTML = '<option value="">-- Pilih Baris --</option>';
            if (!section) {
                const slotSelect = document.getElementById('inSlot');
                if (slotSelect) slotSelect.innerHTML = '<option value="">-- Pilih Slot --</option>';
                return;
            }
            
            const barisObj = currentSections()[section] || {};
            Object.keys(barisObj).sort().forEach((barisName, idx) => {
                const paddedIdx = String(idx + 1).padStart(2, '0');
                const label = `${section} ${paddedIdx}`;
                barisSelect.innerHTML += `<option value="${Utils.escapeHtml(barisName)}">${Utils.escapeHtml(label)}</option>`;
            });
            
            if (Object.keys(barisObj).length > 0) {
                barisSelect.value = Object.keys(barisObj)[0];
                updateSlotSelect();
            }
        }
        
        function updateSlotSelect() {
            const section = document.getElementById('inSection')?.value;
            const baris = document.getElementById('inBaris')?.value;
            const slotSelect = document.getElementById('inSlot');
            if (!slotSelect) return;
            
            slotSelect.innerHTML = '<option value="">-- Pilih Slot --</option>';
            if (!section || !baris) return;
            
            const slots = currentSections()[section]?.[baris];
            if (!slots) return;
            
            for (let i = 0; i < 5; i++) {
                const basketNum = slots[i];
                const slotNum = i + 1;
                if (basketNum !== null) {
                    const count = itemCount(basketNum);
                    const cap = getBasketCapacity(basketNum);
                    const isFull = isBasketFull(basketNum);
                    slotSelect.innerHTML += `
                        <option value="${slotNum}" ${isFull ? 'disabled' : ''}>
                            Slot ${slotNum}: ${basketNum} (${count}/${cap})${isFull ? ' - PENUH' : ''}
                        </option>
                    `;
                } else {
                    slotSelect.innerHTML += `<option value="${slotNum}">Slot ${slotNum} (kosong)</option>`;
                }
            }
        }
        
        function updateNamaDatalist() {
            const names = new Set();
            currentTransactions().forEach(txn => {
                if (txn.detail?.nama) {
                    names.add(Utils.escapeHtml(txn.detail.nama));
                }
            });
            const datalist = document.getElementById('namaList');
            if (datalist) {
                datalist.innerHTML = [...names].map(name => `<option value="${name}">`).join('');
            }
        }

        const newNum = parseInt(manualNum);
                const area = state.currentArea; // <--- HANYA CEK AREA SAAT INI
                
                for (const [secName, barisObj] of Object.entries(state.appData[area].sections)) {
                    for (const slotArr of Object.values(barisObj)) {
                        if (slotArr.includes(newNum)) {
                            return showToast(`❌ Nomor ${newNum} sudah digunakan di ${area} ${secName}.`, 'critical');
                        }
                    }
                }
                slots[slotIdx] = newNum;
        if (!currentBaskets()[newNum]) {
            currentBaskets()[newNum] = { section, baris, slot: slotIdx + 1, items: [] };

    } else {

    }

    const newItem = {

        addedBy: currentUser
    };
    if (expDate) newItem.expDate = expDate;
    if (estOutDate) newItem.estOutDate = estOutDate;

    currentBaskets()[basketNum].items.push(newItem);
  currentBaskets()[basketNum].lastModifiedBy = currentUser;
  currentBaskets()[basketNum].lastModifiedAt = new Date().toISOString();

             // ✅ LOG DULU SEBELUM SAVE agar masuk ke state.appData
  logTransaction('in', {

  });
      try {

        const debouncedSearch = Utils.debounce(performSearch, CONFIG.searchDebounceMs);
        
        function performSearch() {
    const query = document.getElementById('searchInput')?.value.trim().toLowerCase() || '';
    const resultsContainer = document.getElementById('searchResults');
    const statusFilter = document.getElementById('searchStatus')?.value || '';
    const dateFrom = document.getElementById('searchDateFrom')?.value;
    const dateTo = document.getElementById('searchDateTo')?.value;
    
    const isBasketStatus = ['aktif','expired','est-lewat','retain','penuh'].includes(statusFilter);
    const isTxnFilter = ['masuk', 'keluar', 'pindah'].includes(statusFilter);
    
    // ✅ Izinkan query kosong jika filter status keranjang aktif
    if (!query && !isBasketStatus && !isTxnFilter) {
        resultsContainer.innerHTML = '<div class="empty-state">Ketik minimal 2 karakter atau pilih filter status</div>';
        return;
    }
    if (isTxnFilter && (!query || query.length < 2)) {
        resultsContainer.innerHTML = '<div class="empty-state">Ketik minimal 2 karakter untuk riwayat transaksi</div>';
        return;
    }
    
    const results = [];
    if (isTxnFilter) {
        currentTransactions().forEach(txn => {
            const matchesType = 
                (statusFilter === 'masuk' && txn.type === 'in') ||
                (statusFilter === 'keluar' && txn.type === 'out') ||
                (statusFilter === 'pindah' && txn.type === 'move');
            if (matchesType && txn.detail?.nama?.toLowerCase().includes(query)) {
                results.push({ type: 'transaction', transactionType: txn.type, area: txn.area || 'frozen', item: txn.detail, timestamp: txn.timestamp, user: txn.user, detail: txn.detail });
            }
        });
    } else {
        collectSearchResults('frozen', query, results);
        collectSearchResults('chiller', query, results);
    }
    
    let filtered = results;
    if (!isTxnFilter) {
        if (statusFilter === 'expired') {
            filtered = filtered.filter(r => r.item.expDate && Utils.isDateExpired(r.item.expDate));
        } else if (statusFilter === 'est-lewat') {
            filtered = filtered.filter(r => r.item.estOutDate && Utils.isDateExpired(r.item.estOutDate));
        } else if (statusFilter === 'aktif') {
            filtered = filtered.filter(r => 
                (!r.item.expDate || !Utils.isDateExpired(r.item.expDate)) &&
                (!r.item.estOutDate || !Utils.isDateExpired(r.item.estOutDate)) &&
                !r.item.isRetainSample
            );
        } else if (statusFilter === 'retain') {
            filtered = filtered.filter(r => r.item.isRetainSample === true);
        } else if (statusFilter === 'penuh') {
            filtered = filtered.filter(r => {
                const count = (state.appData[r.area]?.baskets[r.keranjangNo]?.items || []).length;
                const capacity = getBasketCapacity(r.keranjangNo);
                return count >= capacity;
            });
        }
    }
    
    if (dateFrom) filtered = filtered.filter(r => r.item.expDate && Utils.parseDate(r.item.expDate) >= Utils.parseDate(dateFrom));
    if (dateTo) filtered = filtered.filter(r => r.item.expDate && Utils.parseDate(r.item.expDate) <= Utils.parseDate(dateTo));
    
    if (filtered.length === 0) {
        resultsContainer.innerHTML = `<div class="empty-state">Tidak ditemukan "${Utils.escapeHtml(query || statusFilter)}"</div>`;
        return;
    }
    
    let html = `<div class="search-stats" role="status"><div class="search-stat"><div class="count">${filtered.length}</div><div class="label">Ditemukan</div></div></div>`;
    
    filtered.forEach(r => {
        let owner = r.item.addedBy || r.user;
        if (!owner || ['unknown','Tidak diketahui'].includes(owner)) owner = findItemOwner(r.item.nama, r.detail?.keranjang || r.keranjangNo, r.area || 'frozen', r.item.tglMasuk) || 'Tidak diketahui';
        const ownerDisplay = owner ? owner.split('@')[0] : 'Tidak diketahui';
        
        let iconHtml = '', badgeClass = '', badgeText = '';
        if (r.type === 'transaction') {
            if (r.transactionType === 'in' || r.transactionType === 'masuk') { iconHtml = '<i class="fas fa-arrow-down" style="color:#10b981" aria-hidden="true"></i>'; badgeClass = 'status-masuk'; badgeText = 'Masuk'; }
            else if (r.transactionType === 'out' || r.transactionType === 'keluar') { iconHtml = '<i class="fas fa-arrow-up" style="color:#ef4444" aria-hidden="true"></i>'; badgeClass = 'status-keluar'; badgeText = 'Keluar'; }
            else if (r.transactionType === 'edit') { iconHtml = '<i class="fas fa-calendar-alt" style="color:#f59e0b" aria-hidden="true"></i>'; badgeClass = 'status-est-lewat'; badgeText = 'Edit Est'; }
            else if (r.transactionType === 'status') { iconHtml = '<i class="fas fa-vial" style="color:#7c3aed" aria-hidden="true"></i>'; badgeClass = 'status-pindah'; badgeText = 'Status'; }
            else { iconHtml = '<i class="fas fa-exchange-alt" style="color:#8b5cf6" aria-hidden="true"></i>'; badgeClass = 'status-pindah'; badgeText = 'Pindah'; }
        } else {
            if (r.item.isRetainSample) {
                iconHtml = '<i class="fas fa-vial" style="color:#7c3aed" aria-hidden="true"></i>';
                badgeClass = 'status-pindah'; badgeText = 'Retain';
            } else if (r.item.expDate && Utils.isDateExpired(r.item.expDate)) {
                iconHtml = '<i class="fas fa-skull" style="color:#ef4444" aria-hidden="true"></i>'; badgeClass = 'status-expired'; badgeText = 'Expired';
            } else if (r.item.estOutDate && Utils.isDateExpired(r.item.estOutDate)) {
                iconHtml = '<i class="fas fa-hourglass-end" style="color:#f97316" aria-hidden="true"></i>'; badgeClass = 'status-est-lewat'; badgeText = 'Est. Lewat';
            } else if (statusFilter === 'penuh') {
                iconHtml = '<i class="fas fa-ban" style="color:#f59e0b" aria-hidden="true"></i>'; badgeClass = 'status-est-lewat'; badgeText = 'Penuh';
            } else {
                iconHtml = '<i class="fas fa-circle" style="color:#10b981" aria-hidden="true"></i>'; badgeClass = 'status-aktif'; badgeText = 'Aktif';
            }
        }
        
        const dateStr = r.timestamp ? new Date(r.timestamp).toLocaleDateString('id-ID') : '-';
        let locStr = '';
        if (r.type !== 'transaction') {
  locStr = `<div style="margin-top:4px;font-size:0.8rem;color:#64748b;">📍 <strong>${Utils.escapeHtml(r.section)} ${String(r.keranjangNo).padStart(2,'0')}</strong> ${r.area==='frozen'?'(Frozen)':'(Chiller)'}</div>
  <div style="font-size:0.75rem;color:#64748b;margin-top:2px;">👤 Penambah: ${Utils.escapeHtml(ownerDisplay)}</div>`;
} else {
            locStr = `<div style="margin-top:4px;font-size:0.8rem;color:#64748b;">📅 ${dateStr} | 👤 ${Utils.escapeHtml(ownerDisplay)}</div>`;
            if (r.detail?.dari && r.detail?.ke) locStr += `<div style="font-size:0.75rem;color:#8b5cf6;">🔄 ${Utils.escapeHtml(r.detail.dari)} → ${Utils.escapeHtml(r.detail.ke)}</div>`;
        }
        
        let itemClass = '';
        if (r.type === 'transaction') {
            itemClass = r.transactionType === 'in' ? 'in' : r.transactionType === 'out' ? 'out' : 'move';
        } else {
            if (r.item.isRetainSample) itemClass = 'retain';
            else if (r.item.expDate && Utils.isDateExpired(r.item.expDate)) itemClass = 'expired';
            else if (r.item.estOutDate && Utils.isDateExpired(r.item.estOutDate)) itemClass = 'est-lewat';
            else itemClass = 'aktif';
        }
        
        html += `
            <div class="search-result-item ${itemClass}" onclick="${r.type !== 'transaction' ? `App.navigateToBasket(${r.keranjangNo},'${r.area}')` : ''}" role="listitem" tabindex="0">
                <div class="search-result-header">
                    <div><span class="status-badge ${badgeClass}">${iconHtml} ${badgeText}</span> ${r.type !== 'transaction' ? `<span class="area-badge ${r.area==='frozen'?'area-frozen':'area-chiller'}">${r.area==='frozen'?'❄️':'🌡️'}</span>` : ''}</div>
                    <div><small>${Utils.escapeHtml(r.item.jenis||'-')}</small></div>
                </div>
                <div><strong>${highlightText(r.item.nama, query)}</strong> <span style="color:#64748b;">Qty: ${Utils.escapeHtml(r.item.qty)}</span></div>
                ${locStr}
                ${r.type !== 'transaction' ? `<div style="margin-top:6px;"><button class="btn btn-sm btn-outline" onclick="App.navigateToBasket(${r.keranjangNo},'${r.area}')" aria-label="Lihat keranjang ${r.keranjangNo}">Lihat Keranjang</button></div>` : ''}
            </div>
        `;
    });
    
    resultsContainer.innerHTML = html;
}
        
        function collectSearchResults(area, query, results) {
            const baskets = state.appData[area].baskets;
            for (const [basketNum, basket] of Object.entries(baskets)) {
                if (basket.items?.length) {
                    basket.items.forEach(item => {
                        if (item.nama?.toLowerCase().includes(query)) {
                            results.push({
                                area,
                                status: 'current',
                                item,
                                keranjangNo: parseInt(basketNum),
                                section: basket.section,
                                baris: basket.baris,
                                slot: basket.slot
                            });
                        }
                    });
                }
            }
        }
        
        function highlightText(text, query) {
            if (!text || !query) return Utils.escapeHtml(text);
            const escaped = text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return escaped.replace(regex, '<span class="search-highlight">$1</span>');
        }
        
        function navigateToBasket(basketNum, area) {
            if (state.currentArea !== area) {
                state.currentArea = area;
                DOM.areaSelect.value = area;
                DOM.areaTitle.textContent = area === 'frozen' ? 'Frozen' : 'Chiller';
            }
            state.currentTab = 'dashboard';
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            const dashboardBtn = document.querySelector('.tab-btn[data-tab="dashboard"]');
            if (dashboardBtn) {
                dashboardBtn.classList.add('active');
                dashboardBtn.setAttribute('aria-selected', 'true');
            }
            renderDashboard();
            setTimeout(() => {
                showBasketDetail(basketNum);
                showToast(`📍 Membuka Keranjang ${basketNum}`);
            }, 200);
        }
        
        // ==================== HISTORY ====================
        function renderHistory() {
            const list = currentTransactions().slice(0, 100).map(txn => {
                let typeClass = '', badgeClass = '', icon = '', typeLabel = '';
                
                if (txn.type === 'in') {
                    typeClass = 'type-in'; badgeClass = 'badge-in'; icon = '📥'; typeLabel = 'MASUK';
                } else if (txn.type === 'move') {
                    typeClass = 'type-move'; badgeClass = 'badge-move'; icon = '🔄'; 
                    typeLabel = txn.detail?.jenis === 'KERANJANG' ? 'PINDAH KERANJANG' : 'PINDAH BARANG';
                } else if (txn.type === 'edit') {
                    typeClass = 'type-edit'; badgeClass = 'badge-edit'; icon = '✏️'; typeLabel = 'EDIT EST';
                } else if (txn.type === 'status') {
                    typeClass = 'type-move'; badgeClass = 'badge-move'; icon = '🧪'; typeLabel = 'STATUS';
                } else {
                    typeClass = 'type-out'; badgeClass = 'badge-out'; icon = '📤'; typeLabel = 'KELUAR';
                }
                
                const detail = txn.detail || {};
                const rawUser = txn.user || 'unknown';
                const displayName = rawUser.includes('@') ? rawUser.split('@')[0] : rawUser;
                const userInfo = rawUser !== 'unknown' 
                  ? `<span style="font-size:0.7rem;color:#64748b;">👤 ${Utils.escapeHtml(displayName)}</span>` 
                  : '<span style="font-size:0.7rem;color:#94a3b8;">👤 System</span>';
                
                let extraInfo = '';
                if (txn.type === 'in') {
                    extraInfo = `ditambahkan ke Keranjang <strong>${detail.keranjang || '-'}</strong> | Section: ${Utils.escapeHtml(detail.section || '-')}`;
                } else if (txn.type === 'move') {
                    extraInfo = `dari <strong>${Utils.escapeHtml(detail.dari || '-')}</strong> → <strong>${Utils.escapeHtml(detail.ke || '-')}</strong>`;
                } else if (txn.type === 'edit') {
                    extraInfo = `Est: ${Utils.escapeHtml(detail.oldEstOutDate || '-')} → <strong>${Utils.escapeHtml(detail.newEstOutDate || '-')}</strong>`;
                } else if (txn.type === 'status') {
                    extraInfo = `Diubah menjadi: <strong>${Utils.escapeHtml(detail.statusBaru || '-')}</strong>`;
                } else if (txn.type === 'out') {
                    extraInfo = `dari Keranjang <strong>${detail.keranjang || '-'}</strong> | Section: ${Utils.escapeHtml(detail.section || '-')}`;
                    if (detail.partial) extraInfo += ' <span style="color:#f59e0b;">⚠️ Sebagian</span>';
                }
                
                return `
                    <div class="history-item ${typeClass}" role="listitem">
                        <div style="font-size:1.5rem;flex-shrink:0;" aria-hidden="true">${icon}</div>
                        <div style="flex:1;">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:4px;">
                                <div><span class="history-badge ${badgeClass}">${typeLabel}</span> ${userInfo}</div>
                                <small style="color:#64748b;font-weight:600;">${new Date(txn.timestamp).toLocaleString('id-ID')}</small>
                            </div>
                            <div style="margin-top:4px;">
                                <strong>${Utils.escapeHtml(detail.nama || '-')}</strong> — ${Utils.escapeHtml(detail.qty || '-')} (${Utils.escapeHtml(detail.jenis || '-')})
                            </div>
                            <div style="font-size:0.75rem;color:#64748b;margin-top:4px;">${extraInfo}</div>
                        </div>
                    </div>
                `;
            }).join('');
            
            DOM.container.innerHTML = `
                <div class="card" style="border-top: 6px solid var(--primary); padding: 24px 20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;">
                        <div>
                            <h3 style="margin:0; font-size:1.4rem; color:var(--text-primary);">📋 Riwayat Aktivitas</h3>
                            <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px; margin-bottom:0;">Pantau arus keluar-masuk dan perubahan barang</p>
                        </div>
                        <button class="btn btn-sm" style="background:#10b981; color:white; border-radius:10px; padding: 10px 16px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);" onclick="App.showExportHistoryModal()" aria-label="Download riwayat sebagai Excel">
                            <i class="fas fa-file-excel" aria-hidden="true" style="margin-right:6px;"></i> Export Excel
                        </button>
                    </div>
                    <div role="list" aria-label="Daftar riwayat">
                        ${list || `
                        <div class="empty-state" style="padding: 40px 20px;">
                            <i class="fas fa-clipboard-list" style="font-size: 3rem; color: #cbd5e1; margin-bottom:12px;"></i>
                            <div style="color: var(--text-muted); font-size: 0.95rem;">Belum ada aktivitas tercatat di riwayat</div>
                        </div>`}
                    </div>
                </div>
            `;
        }            
                    
        // VARIABEL GLOBAL UNTUK GRAFIK
        let rekapChartInstance = null;

        function setRekapMode(mode) {
            state.rekapMode = mode;
            renderRekap();
        }

        // ==================== REKAP & GRAFIK (ANALYTICS) ====================
        function renderRekap() {
            const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
            const allTransactions = currentTransactions();
            const transactions = allTransactions.filter(t => t.area === state.currentArea || t.area === undefined);
            const currentYear = new Date().getFullYear();
            const yearSet = new Set(transactions.map(t => new Date(t.timestamp).getFullYear()));
            const years = [...yearSet].sort((a,b) => b-a);
            const selectedYear = parseInt(document.getElementById('rekapYearFilter')?.value || currentYear);
            
            let totalIn = 0, totalOut = 0;
            transactions.forEach(t => t.type === 'in' ? totalIn++ : t.type === 'out' ? totalOut++ : null);
            
            // Layout Atas (Statistik Cepat)
            const statsHtml = `
                <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px;">
                    <div class="stat-box" style="background: linear-gradient(135deg, #ecfdf5, #d1fae5); border: 1px solid #34d399; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.1);">
                        <div class="val" style="color: #059669; font-size: 2.2rem;">${totalIn}</div>
                        <div class="lbl" style="color: #166534; font-weight: 600;"><i class="fas fa-arrow-down"></i> Total Masuk</div>
                    </div>
                    <div class="stat-box" style="background: linear-gradient(135deg, #fef2f2, #fee2e2); border: 1px solid #f87171; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.1);">
                        <div class="val" style="color: #dc2626; font-size: 2.2rem;">${totalOut}</div>
                        <div class="lbl" style="color: #991b1b; font-weight: 600;"><i class="fas fa-arrow-up"></i> Total Keluar</div>
                    </div>
                </div>
            `;
            
            const modeTabs = `
                <div class="rekap-tabs" role="tablist" aria-label="Mode rekap" style="background: var(--bg-tertiary); padding: 6px; border-radius: 14px; width: 100%; display: flex; margin-bottom: 20px;">
                    <button class="rekap-tab ${state.rekapMode==='bulanan'?'active':''}" style="flex:1; padding: 10px;"
                            onclick="App.setRekapMode('bulanan')" 
                            role="tab" aria-selected="${state.rekapMode==='bulanan'}">📅 Tren Bulanan</button>
                    <button class="rekap-tab ${state.rekapMode==='tahunan'?'active':''}" style="flex:1; padding: 10px;"
                            onclick="App.setRekapMode('tahunan')" 
                            role="tab" aria-selected="${state.rekapMode==='tahunan'}">📆 Tren Tahunan</button>
                </div>
            `;
            
            // DATA UNTUK GRAFIK
            const chartLabels = [];
            const chartDataIn = [];
            const chartDataOut = [];
            let rows = '';

            if (state.rekapMode === 'bulanan') {
                const monthly = {};
                for (let m = 0; m < 12; m++) { monthly[m] = { in: 0, out: 0, bySection: {} }; } // Siapkan 12 bulan

                transactions.forEach(t => {
                    const d = new Date(t.timestamp);
                    if (d.getFullYear() !== selectedYear) return;
                    const m = d.getMonth();
                    if (t.type === 'in' || t.type === 'out') {
                        monthly[m][t.type]++;
                        const sec = t.detail.section || '-';
                        if (!monthly[m].bySection[sec]) monthly[m].bySection[sec] = { in: 0, out: 0 };
                        monthly[m].bySection[sec][t.type]++;
                    }
                });
                
                for (let m = 0; m < 12; m++) {
                    const data = monthly[m];
                    chartLabels.push(BULAN[m]);
                    chartDataIn.push(data.in);
                    chartDataOut.push(data.out);

                    // Sembunyikan baris tabel jika tidak ada transaksi (tapi di grafik tetap muncul 0)
                    if (data.in === 0 && data.out === 0) continue; 

                    const badges = Object.entries(data.bySection)
                        .map(([s, v]) => `<span class="section-badge">${Utils.escapeHtml(s)}: +${v.in} -${v.out}</span>`).join('');
                    
                    rows += `
                        <tr>
                            <td><strong>${BULAN[m]} ${selectedYear}</strong></td>
                            <td style="color:var(--success); font-weight:700;">+${data.in}</td>
                            <td style="color:var(--danger); font-weight:700;">-${data.out}</td>
                            <td><strong>${data.in - data.out >= 0 ? '+' : ''}${data.in - data.out}</strong></td>
                            <td>${badges}</td>
                        </tr>
                    `;
                }
                if (!rows) rows = `<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px;">Tidak ada transaksi di tahun ${selectedYear}</td></tr>`;
            } else {
                // TAHUNAN
                const yearly = {};
                transactions.forEach(t => {
                    if (t.type !== 'in' && t.type !== 'out') return;
                    const y = new Date(t.timestamp).getFullYear();
                    if (!yearly[y]) yearly[y] = { in: 0, out: 0, bySection: {} };
                    yearly[y][t.type]++;
                    const sec = t.detail.section || '-';
                    if (!yearly[y].bySection[sec]) yearly[y].bySection[sec] = { in: 0, out: 0 };
                    yearly[y].bySection[sec][t.type]++;
                });
                
                const sortedYears = [...Object.keys(yearly)].sort((a,b) => a-b); // Urut naik untuk grafik
                sortedYears.forEach(y => {
                    const data = yearly[y];
                    chartLabels.push(y);
                    chartDataIn.push(data.in);
                    chartDataOut.push(data.out);

                    const badges = Object.entries(data.bySection)
                        .map(([s, v]) => `<span class="section-badge">${Utils.escapeHtml(s)}: +${v.in} -${v.out}</span>`).join('');
                    rows = `
                        <tr>
                            <td><strong>${y}</strong></td>
                            <td style="color:var(--success); font-weight:700;">+${data.in}</td>
                            <td style="color:var(--danger); font-weight:700;">-${data.out}</td>
                            <td><strong>${data.in - data.out >= 0 ? '+' : ''}${data.in - data.out}</strong></td>
                            <td>${badges}</td>
                        </tr>
                    ` + rows; // Balik urutan untuk tabel (terbaru di atas)
                });
                if (!rows) rows = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:20px;">Belum ada data transaksi</td></tr>';
            }
            
            const yearOptions = years.map(y => `<option value="${y}" ${y===selectedYear?'selected':''}>${y}</option>`).join('') 
                || `<option value="${currentYear}">${currentYear}</option>`;
            
            DOM.container.innerHTML = `
                <div class="card" style="border-top: 6px solid var(--primary); padding: 24px 20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
                        <h3 style="margin:0; font-size:1.4rem;">📊 Dashboard Analytics</h3>
                        <button class="btn btn-sm" style="background:#10b981; color:white; border-radius:10px;" onclick="App.downloadRekapExcel()" aria-label="Download rekap Excel">
                            <i class="fas fa-file-excel" aria-hidden="true" style="margin-right:6px;"></i> Export Data
                        </button>
                    </div>

                    ${statsHtml}
                    ${modeTabs}
                    
                    ${state.rekapMode === 'bulanan' ? `
                    <div style="margin-bottom: 16px; display:flex; align-items:center; gap:12px; background:var(--bg-tertiary); padding:10px 16px; border-radius:12px;">
                        <label for="rekapYearFilter" style="margin:0; font-weight:700; color:var(--text-secondary);">Pilih Tahun Laporan:</label>
                        <select id="rekapYearFilter" onchange="App.renderRekap()" aria-label="Pilih tahun" style="width:auto; padding:6px 12px; font-weight:bold; color:var(--primary); border:2px solid var(--primary-light);">
                            ${yearOptions}
                        </select>
                    </div>` : ''}

                    <!-- WADAH GRAFIK CHART.JS -->
                    <div style="background: white; border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 24px; box-shadow: var(--shadow-sm);">
                        <h4 style="font-size: 0.9rem; color: var(--text-secondary); text-align: center; margin-bottom: 16px;">Grafik Pergerakan Barang (${state.currentArea.toUpperCase()})</h4>
                        <div style="position: relative; height: 250px; width: 100%;">
                            <canvas id="rekapChart"></canvas>

        async function downloadExcel() {
            const period = document.getElementById('exportPeriod')?.value || 'all';
            let targetMonth = -1, targetYear = -1;
            let filenameSuffix = 'Semua_Data';

            const now = new Date();

            if (period === 'month') {
                targetMonth = now.getMonth();
                targetYear = now.getFullYear();
                filenameSuffix = `Bulan_${targetMonth+1}_${targetYear}`;
            } else if (period === 'year') {
                targetYear = now.getFullYear();
                filenameSuffix = `Tahun_${targetYear}`;
            } else if (period === 'custom') {
                targetMonth = parseInt(document.getElementById('exportMonth').value);
                targetYear = parseInt(document.getElementById('exportYear').value);
                filenameSuffix = `Bulan_${targetMonth+1}_${targetYear}`;
            }

            // Tutup pop-up
            document.getElementById('exportHistoryModal')?.remove();

            try {
                showToast('⏳ Menarik riwayat dari database...', 'normal');
                // Tarik semua transaksi, lalu saring di sistem agar tidak error Security Rules Firebase
                const snapshot = await db.collection('transactions').orderBy('timestamp', 'desc').get();
                const allTxns = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (period === 'all') {
                        allTxns.push(data);
                    } else {
                        const d = new Date(data.timestamp);
                        if (period === 'year' && d.getFullYear() === targetYear) {
                            allTxns.push(data);
                        } else if ((period === 'month' || period === 'custom') && d.getFullYear() === targetYear && d.getMonth() === targetMonth) {
                            allTxns.push(data);
                        }
                    }
                });
                
                if (!allTxns.length) return showToast('❌ Tidak ada riwayat pada periode tersebut', 'critical');
                
                let html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><h2>Riwayat Transaksi (' + filenameSuffix.replace(/_/g, ' ') + ')</h2><table border="1"><tr style="background:#2563eb;color:white;">';
                html += '<th>Area</th><th>Tanggal</th><th>Jenis</th><th>Item</th><th>Jumlah</th><th>Jenis Brg</th><th>Keranjang</th><th>Section</th><th>User</th><th>Exp</th><th>Est Out</th></tr>';
                
                allTxns.forEach(t => {
                    const d = t.detail || {};
                    const areaLabel = t.area === 'frozen' ? 'Frozen' : 'Chiller';
                    html += `<tr>
                        <td>${areaLabel}</td>
                        <td>${new Date(t.timestamp).toLocaleString('id-ID')}</td>
                        <td>${t.type==='in'?'Masuk':t.type==='move'?'Pindah':t.type==='edit'?'Edit Estimasi':t.type==='status'?'Ubah Status':'Keluar'}</td>
                        <td>${Utils.escapeHtml(d.nama||'')}</td>
                        <td>${Utils.escapeHtml(d.qty||'')}</td>
                        <td>${Utils.escapeHtml(d.jenis||'')}</td>
                        <td>${Utils.escapeHtml(d.keranjang||d.dari||'')}</td>
                        <td>${Utils.escapeHtml(d.section||'')}</td>
                        <td>${Utils.escapeHtml(t.user)}</td>
                        <td>${d.expDate||''}</td>
                        <td>${d.newEstOutDate||d.estOutDate||''}</td>
                    </tr>`;
                });
                html += '</table></body></html>';
                downloadBlob(html, `riwayat_gudang_${filenameSuffix}.xls`);
                showToast('✅ Berhasil mengunduh Excel');
            } catch (err) {
                console.error(err);
                showToast('❌ Gagal memuat data: ' + err.message, 'critical');
            }
        }
        async function downloadRekapExcel() {
            try {
                showToast('⏳ Menghitung rekap dari database...', 'normal');
                const snapshot = await db.collection('transactions').orderBy('timestamp', 'desc').get();
                const txns = [];
                snapshot.forEach(doc => txns.push(doc.data()));
                
                if (!txns.length) return showToast('Tidak ada data untuk diexport', 'critical');
                
                const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
                const grouped = {};
                
                txns.forEach(t => {
                    // Filter: Hanya rekap area yang sedang aktif di layar (Frozen/Chiller)
                    if (t.area !== state.currentArea && t.area !== undefined) return;
                    if (t.type !== 'in' && t.type !== 'out') return;
                    
                    const d = new Date(t.timestamp);
                    const key = state.rekapMode === 'bulanan' 
                        ? `${BULAN[d.getMonth()]} ${d.getFullYear()}` 
                        : `${d.getFullYear()}`;
                    if (!grouped[key]) grouped[key] = { in: 0, out: 0 };
                    grouped[key][t.type]++;
                });
                
                let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><h2>Rekap — ${state.currentArea.toUpperCase()}</h2><table border="1"><tr style="background:#2563eb;color:white;"><th>Periode</th><th>Masuk</th><th>Keluar</th><th>Selisih</th></tr>`;
                
                Object.entries(grouped).forEach(([period, data]) => {
                    html += `<tr><td>${Utils.escapeHtml(period)}</td><td>+${data.in}</td><td>-${data.out}</td><td>${data.in - data.out >= 0 ? '+' : ''}${data.in - data.out}</td></tr>`;
                });
                html += '</table></body></html>';
                downloadBlob(html, `rekap_${state.currentArea}_${new Date().toISOString().split('T')[0]}.xls`);
                showToast('✅ Berhasil mengunduh Rekap Excel');
            } catch (err) {
                console.error(err);
                showToast('❌ Gagal memuat data rekap: ' + err.message, 'critical');
            }
        }
        function downloadBlob(html, filename) {
            const blob = new Blob([html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }
        
        // ==================== HELPER FUNCTIONS ====================
        function findItemOwner(itemName, basketNum, area, tglMasuk) {
            const txns = currentTransactions();
            
            // Try exact match first
            let match = txns.find(t => 
                t.type === 'in' && 
                t.detail?.nama === itemName && 
                t.detail?.keranjang === basketNum && 
                t.detail?.tglMasuk === tglMasuk && 
                t.user && !['unknown', 'Tidak diketahui'].includes(t.user)
            );
            
            if (!match) {
                // Fallback: match by name + basket
                match = txns.find(t => 
                    t.type === 'in' && 
                    t.detail?.nama === itemName && 
                    t.detail?.keranjang === basketNum && 
                    t.user && !['unknown', 'Tidak diketahui'].includes(t.user)
                );
            }
            
            if (!match) {
                // Last resort: match by name only
                match = txns.find(t => 
                    t.type === 'in' && 
                    t.detail?.nama === itemName && 
                    t.user && !['unknown', 'Tidak diketahui'].includes(t.user)
                );
            }
            
            return match?.user || null;
        }
        
        // ==================== REMINDER ====================
        function renderReminder() {
            const alerts = [];
            const cekOverThawing = (tgl) => tgl && (new Date().setHours(0,0,0,0) - new Date(tgl).setHours(0,0,0,0)) / 86400000 > 7;
            
            for (const area of ['frozen', 'chiller']) {
                const baskets = state.appData[area].baskets;
                for (const [basketNum, basket] of Object.entries(baskets)) {
                    (basket.items || []).forEach(item => {
                        if (item.isRetainSample) return; // Retain diabaikan dari reminder
                        
                        const isExpired = item.expDate && Utils.isDateExpired(item.expDate);
                        const isEstLewat = item.estOutDate && Utils.isDateExpired(item.estOutDate);
                        const isOverThawing = basket.section === 'THAWING' && cekOverThawing(item.tglMasuk);
                        
                        if (isExpired || isEstLewat || isOverThawing) {
                            let owner = item.addedBy;
                            if (!owner || ['unknown', 'Tidak diketahui'].includes(owner)) {
                                owner = findItemOwner(item.nama, parseInt(basketNum), area, item.tglMasuk) || 'Tidak diketahui';
                            }
                            
                            alerts.push({
                                area, basket: parseInt(basketNum), section: basket.section, baris: basket.baris, slot: basket.slot,
                                nama: item.nama, qty: item.qty, jenis: item.jenis || '-', tglMasuk: item.tglMasuk,
                                expDate: item.expDate || null, estOutDate: item.estOutDate || null,
                                addedBy: owner.split('@')[0], addedByEmail: owner, isExpired, isEstLewat, isOverThawing
                            });
                        }
                    });
                }
            }
            
            if (alerts.length === 0) {
                DOM.container.innerHTML = `
                    <div class="card" style="border-top: 6px solid #10b981; text-align:center; padding:60px 20px;">

            }
            
            const byUser = {};
            alerts.forEach(item => {
                const key = item.addedByEmail || 'unknown';
                if (!byUser[key]) byUser[key] = { displayName: item.addedBy, items: [] };
                byUser[key].items.push(item);
            });
            
            const totalExpired = alerts.filter(i => i.isExpired).length;
            const totalEstLewat = alerts.filter(i => i.isEstLewat && !i.isExpired && !i.isOverThawing).length;
            const totalUsers = Object.keys(byUser).length;
            
            let html = `

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px;">

                            </button>

        function copyUserReminderByKey(userKey, userDisplay) {
            const data = window._reminderData;
            if (!data?.groupedByUser?.[userKey]) return;
            
            const items = data.groupedByUser[userKey].items;
            const expired = items.filter(i => i.isExpired);
            const overThaw = items.filter(i => i.isOverThawing && !i.isExpired);
            const estLewat = items.filter(i => i.isEstLewat && !i.isExpired && !i.isOverThawing);
            
            let text = `📋 *REMINDER STOK GUDANG*\nKepada: *${userDisplay}*\nTanggal: ${new Date().toLocaleDateString('id-ID')}\n\n`;

                expired.forEach(it => {

                    text += `\n`;
                }
                
                if (overThaw.length > 0) {
                    text += `🔥 OVER THAWING (> 7 Hari):\n`;
                    overThaw.forEach(it => {
                        text += `  • ${it.nama} (${it.qty})\n    📍 🌡️ Chiller | THAWING | Krj ${it.basket}\n    ⏰ Mulai: ${new Date(it.tglMasuk).toLocaleDateString('id-ID')}\n`;
                    });
                    text += `\n`;
                }
                
                if (estLewat.length > 0) {
                    text += `⏳ EST LEWAT:\n`;
                    estLewat.forEach(it => {
                        const areaLabel = it.area === 'frozen' ? '❄️ Frozen' : '🌡️ Chiller';
                        text += `  • ${it.nama} (${it.qty})\n    📍 ${areaLabel} | ${it.section} | Krj ${it.basket}\n    📅 Est: ${new Date(it.estOutDate).toLocaleDateString('id-ID')}\n`;
                    });
                    text += `\n`;
                }
                text += `\n`;
            }
            
            text += `⚠️ Segera lakukan tindakan.\n📞 Info: Gudang Walk-in`;
            copyToClipboard(text);
            showToast('✅ Semua reminder dicopy untuk Broadcast WA.');
        }
        
        function copyToClipboard(text) {
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => console.log('✅ Copied'))
                    .catch(err => {
                        console.error('Clipboard error:', err);
                        fallbackCopy(text);
                    });
            } else {
                fallbackCopy(text);
            }
        }
        
        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ Teks dicopy!');
            } catch {
                showToast('❌ Gagal copy. Silakan copy manual.');
            }
            document.body.removeChild(textarea);
        }

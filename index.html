    <style>
        :root {
            --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
            --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #dbeafe;
            --success: #10b981; --success-light: #d1fae5; --warning: #f59e0b; --warning-light: #fef3c7;
            --danger: #ef4444; --danger-light: #fee2e2; --purple: #8b5cf6; --purple-light: #ede9fe;
            --orange: #f97316; --orange-light: #ffedd5; --border: #e2e8f0; --border-focus: #3b82f6;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-glow: 0 0 0 3px rgb(59 130 246 / 0.15);
            --radius: 16px; --radius-sm: 12px; --radius-lg: 24px;
            --transition: all 0.2s ease; --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --toast-z: 200; --basket-num-z: 10;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        
        /* Header & Navigation */
        .header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); width: 100%; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; color: white; position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap; box-shadow: var(--shadow); }
        .header h2 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.025em; display: flex; align-items: center; gap: 6px; }
        .area-selector { display: flex; align-items: center; gap: 8px; }
        .area-selector select { padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white; font-weight: 500; font-size: 0.85rem; cursor: pointer; transition: var(--transition); }
        .area-selector select:hover, .area-selector select:focus { background: rgba(255,255,255,0.2); outline: none; border-color: rgba(255,255,255,0.4); }
        .area-selector select option { background: var(--bg-secondary); color: var(--text-primary); }
        .user-row { display: flex; align-items: center; gap: 8px; }
        .user-row span { font-size: 0.8rem; color: rgba(255,255,255,0.9); font-weight: 500; }
        
        .tab-bar { display: flex; width: 100%; background: var(--bg-secondary); padding: 8px 12px; gap: 4px; overflow-x: auto; box-shadow: var(--shadow-sm); position: sticky; top: 60px; z-index: 90; scrollbar-width: none; }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 1 0 auto; padding: 10px 16px; border: none; background: transparent; font-weight: 500; color: var(--text-secondary); border-radius: 10px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; transition: var(--transition); position: relative; }
        .tab-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .tab-btn.active { background: var(--primary); color: white; font-weight: 600; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; background: var(--primary); border-radius: 2px; }
        
        .container { width: 100%; max-width: 720px; padding: 16px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .card { background: var(--bg-secondary); border-radius: var(--radius); padding: 20px 18px; box-shadow: var(--shadow); border: 1px solid var(--border); transition: var(--transition-smooth); }
        .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
        
        /* Form Elements */
        .form-group { margin-bottom: 16px; }
        label { font-weight: 600; font-size: 0.8rem; display: block; margin-bottom: 6px; color: var(--text-primary); letter-spacing: 0.025em; }
        input, select { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 0.95rem; background: var(--bg-secondary); color: var(--text-primary); transition: var(--transition); }
        input:focus, select:focus { outline: none; border-color: var(--border-focus); box-shadow: var(--shadow-glow); background: var(--bg-primary); }
        input::placeholder { color: var(--text-muted); }
        
        /* Buttons */
        .btn { padding: 12px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; transition: var(--transition); letter-spacing: -0.01em; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgb(59 130 246 / 0.4); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #dc2626; box-shadow: 0 4px 12px rgb(239 68 68 / 0.4); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-primary); }
        .btn-outline:hover { background: var(--bg-tertiary); border-color: var(--text-muted); }
        .btn-sm { padding: 8px 14px; font-size: 0.8rem; border-radius: 10px; }
        .btn-quick { padding: 5px 10px; font-size: 0.75rem; background: var(--primary-light); color: var(--primary); border: 1px solid var(--primary); border-radius: 8px; cursor: pointer; margin-top: 6px; transition: var(--transition); font-weight: 500; }
        .btn-quick:hover { background: var(--primary); color: white; }
        .google-btn { background: white; color: var(--text-primary); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border-radius: 12px; cursor: pointer; font-weight: 500; margin-top: 12px; width: 100%; transition: var(--transition); box-shadow: var(--shadow-sm); }
        .google-btn:hover { box-shadow: var(--shadow); transform: translateY(-1px); border-color: var(--text-muted); }
        .google-btn i { font-size: 1.1rem; }
        
        /* Item Rows & Lists */
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: var(--bg-tertiary); border-radius: 12px; margin-bottom: 8px; transition: var(--transition); border: 1px solid transparent; }
        .item-row:hover { background: var(--bg-secondary); border-color: var(--border); box-shadow: var(--shadow-sm); }
        .item-row.expired { background: var(--danger-light); border-color: var(--danger); }
        .item-row.expired:hover { background: #fecaca; }
        .empty-state { color: var(--text-muted); text-align: center; padding: 32px 20px; font-size: 0.9rem; }
        .empty-state i { font-size: 2rem; margin-bottom: 12px; opacity: 0.6; display: block; }

         /* ==================== WARNA & DESAIN YANG HILANG (KERANJANG & RIWAYAT) ==================== */
        .item-actions { display: flex; gap: 4px; }
        .action-btn { width: 32px; height: 32px; border-radius: 8px; border: none; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); color: white; }
        .move-btn { background: var(--purple); }
        .move-btn:hover { background: #7c3aed; }
        .edit-btn { background: var(--warning); color: #000; }
        .edit-btn:hover { background: #d97706; color: white; }
        .out-btn { background: var(--danger); }
        .out-btn:hover { background: #dc2626; }
        
        .basket-move-btn { background: linear-gradient(135deg, var(--purple), #7c3aed); color: white; padding: 8px 14px; font-size: 0.8rem; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 6px; }
        .basket-move-btn:hover { box-shadow: 0 4px 12px rgb(139 92 246 / 0.4); transform: translateY(-1px); }

        .move-form { background: var(--bg-secondary); border: 1px solid var(--purple); border-radius: 12px; padding: 12px; margin-top: 10px; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .history-item { display: flex; align-items: flex-start; gap: 12px; padding: 16px; background: var(--bg-secondary); border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); transition: var(--transition); }
        .history-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); border-color: var(--primary); }
        .history-item.type-in { background: var(--success-light); border-color: #a7f3d0; }
        .history-item.type-out { background: var(--danger-light); border-color: #fecaca; }
        .history-item.type-move { background: var(--purple-light); border-color: #e9d5ff; }
        .history-item.type-edit { background: var(--warning-light); border-color: #fde68a; }
        .history-badge { font-size: 0.7rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.02em; display:inline-block; }
        .badge-in { background: var(--success); color: white; }
        .badge-out { background: var(--danger); color: white; }
        .badge-move { background: var(--purple); color: white; }
        .badge-edit { background: var(--warning); color: #000; }
        
        /* -------------------------------------------------------------------------------------- */
        
        /* Toast Notification - FIXED POSITION & Z-INDEX */
        .toast { 
            position: fixed; 
            bottom: 80px; /* ↑ Naikkan agar tidak menutupi basket numbers */
            left: 50%; 
            transform: translateX(-50%) translateY(20px); 
            background: var(--text-primary); 
            color: white; 
            padding: 14px 24px; 
            border-radius: 14px; 
            text-align: center; 
            opacity: 0; 
            transition: var(--transition-smooth); 
            z-index: var(--toast-z); 
            font-weight: 500; 
            box-shadow: var(--shadow-lg); 
            max-width: 90%; 
            pointer-events: none; /* Agar tidak blocking click */
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.critical { background: var(--danger); animation: pulse-danger 1s infinite; }
        
        /* Chips & Badges */
        .chip { background: var(--bg-tertiary); border-radius: 100px; padding: 5px 12px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px; margin: 2px; font-weight: 500; color: var(--text-secondary); }
        .baris-label { font-size: 0.75rem; font-weight: 700; margin: 12px 0 6px 0; background: var(--primary-light); color: var(--primary); display: inline-block; padding: 4px 12px; border-radius: 100px; }
        .section-badge { background: var(--primary-light); color: var(--primary); border-radius: 100px; padding: 3px 10px; font-size: 0.7rem; font-weight: 600; margin: 2px; display: inline-block; }
        .area-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; }
        .area-frozen { background: var(--primary-light); color: var(--primary); }
        .area-chiller { background: var(--success-light); color: var(--success); }
        
        /* Status Badges - Colorblind Safe */
        .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; }
        .status-aktif { background: var(--success-light); color: var(--success); }
        .status-expired { background: var(--danger-light); color: var(--danger); }
        .status-est-lewat { background: var(--orange-light); color: var(--orange); }
        .status-masuk { background: var(--success-light); color: var(--success); }
        .status-keluar { background: var(--danger-light); color: var(--danger); }
        .status-pindah { background: var(--purple-light); color: var(--purple); }
        
        /* Rekap & Stats */
        .rekap-tabs { display: flex; gap: 6px; margin-bottom: 16px; background: var(--bg-tertiary); padding: 4px; border-radius: 12px; width: fit-content; }
        .rekap-tab { padding: 8px 18px; border-radius: 10px; border: none; background: transparent; font-weight: 500; cursor: pointer; font-size: 0.85rem; color: var(--text-secondary); transition: var(--transition); }
        .rekap-tab:hover { color: var(--text-primary); }
        .rekap-tab.active { background: var(--bg-secondary); color: var(--primary); font-weight: 600; box-shadow: var(--shadow-sm); }
        .rekap-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85rem; background: var(--bg-secondary); border-radius: 12px; overflow: hidden; }
        .rekap-table th { background: var(--text-primary); color: white; padding: 12px 10px; text-align: left; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.025em; }
        .rekap-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
        .rekap-table tr:last-child td { border-bottom: none; }
        .rekap-table tr:hover td { background: var(--bg-tertiary); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-box { background: var(--bg-secondary); border-radius: 16px; padding: 16px; text-align: center; border: 1px solid var(--border); transition: var(--transition); }
        .stat-box:hover { border-color: var(--primary); box-shadow: var(--shadow-glow); }
        .stat-box .val { font-size: 1.8rem; font-weight: 800; color: var(--primary); line-height: 1; }
        .stat-box .lbl { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
        .stat-box.out .val { color: var(--danger); }
        .stat-box.out { background: var(--danger-light); border-color: transparent; }
        
        /* Search */
        .search-container { background: var(--bg-secondary); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .search-input-wrapper { position: relative; margin-bottom: 16px; }
        .search-input-wrapper input { padding-right: 48px; font-size: 1rem; }
        .search-input-wrapper .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; font-size: 1.1rem; transition: var(--transition); }
        .search-input-wrapper .search-icon:hover { color: var(--primary); }
        .search-result-item { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; transition: var(--transition); cursor: pointer; }
        .search-result-item:hover { border-color: var(--primary); box-shadow: var(--shadow-glow); background: var(--bg-secondary); }
        .search-result-item.aktif { border-left: 4px solid var(--success); background: var(--success-light); }
        .search-result-item.expired { border-left: 4px solid var(--danger); background: var(--danger-light); }
        .search-result-item.est-lewat { border-left: 4px solid var(--orange); background: var(--orange-light); }
        .search-result-item.retain { border-left: 4px solid var(--purple); background: var(--purple-light); }
        .search-result-item.in { border-left: 4px solid var(--success); background: var(--success-light); }
        .search-result-item.out { border-left: 4px solid var(--danger); background: var(--danger-light); opacity: 0.95; }
        .search-result-item.move { border-left: 4px solid var(--purple); background: var(--purple-light); }
        .search-result-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .search-highlight { background: var(--warning-light); color: var(--warning); padding: 1px 4px; border-radius: 4px; font-weight: 600; }
        .search-stats { display: flex; gap: 12px; margin-bottom: 16px; padding: 12px; background: var(--primary-light); border-radius: 12px; }
        .search-stat { text-align: center; flex: 1; }
        .search-stat .count { font-size: 1.4rem; font-weight: 800; color: var(--primary); line-height: 1; }
        .search-stat .label { font-size: 0.7rem; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
        
        /* Floor Plan - FIXED MOBILE LABELS */
        .fp-room { border: 2px solid var(--text-primary); border-radius: 12px; padding: 12px; overflow-x: auto; background: var(--bg-secondary); -webkit-overflow-scrolling: touch; }
        .fp-room-title { font-weight: 700; font-size: 0.95rem; color: var(--text-primary); margin-bottom: 12px; text-align: center; padding: 8px; background: var(--bg-tertiary); border-radius: 10px; }
        .fp-legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 12px 4px; font-size: 0.75rem; font-weight: 500; margin-top: 14px; color: var(--text-secondary); }
        .fp-legend span { display: flex; align-items: center; gap: 5px; }
        
        .baris-box { 
            width: 110px; 
            height: 180px; /* ↑ Lebih tinggi untuk label */
            background: linear-gradient(145deg, #fef3c7, #fde68a); 
            border: 2px solid #d97706; 
            border-radius: 12px; 
            padding: 6px; 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; 
            transition: var(--transition); 
        }
        .baris-box:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
        
        /* FIXED: Baris label visible on mobile */
        .baris-box-lbl { 
            font-size: 0.7rem; /* ↑ Lebih besar */
            font-weight: 700; 
            color: #92400e; 
            text-align: center; 
            line-height: 1.3; 
            margin-bottom: 6px; /* ↑ Jarak lebih */
            white-space: nowrap; 
            overflow: visible; /* ↑ Jangan dipotong */
            text-overflow: clip; /* ↑ Jangan ellipsis */
            background: rgba(255,255,255,0.7);
            padding: 2px 4px;
            border-radius: 4px;
        }
        
        .baris-slots { display: flex; flex-direction: column-reverse; gap: 3px; flex: 1; min-height: 0; }
        
        /* FIXED: Layout Basket Slot yang Elegan (Row-based) */
        .basket-slot { 
            flex: 1; 
            min-height: 0; 
            border-radius: 8px; 
            background: var(--bg-secondary); 
            border: 1.5px solid var(--border); 
            display: flex; 
            flex-direction: row; /* Berjejer Kiri-Kanan */
            align-items: center; 
            justify-content: space-between; /* Renggangkan Kiri & Kanan */
            cursor: pointer; 
            position: relative; 
            transition: var(--transition); 
            overflow: hidden; 
            font-weight: 600; 
            padding: 4px 6px; 
        }
        .basket-slot:hover { border-color: var(--primary); transform: scale(1.02); }
        .basket-slot:active { transform: scale(0.98); }
        .basket-slot.green { border-color: var(--success); background: var(--success-light); }
        .basket-slot.yellow { border-color: var(--warning); background: var(--warning-light); animation: pulse-warning 2s infinite; }
        .basket-slot.red { border-color: var(--danger); background: var(--danger-light); animation: pulse-danger 1s infinite; }
        .basket-slot.slot-empty { background: var(--bg-tertiary); border: 1.5px dashed var(--border); cursor: default; }
        .basket-slot.slot-empty:hover { border-color: var(--text-muted); transform: none; }
        
        .basket-num-badge {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 100px;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.2);
            min-width: 28px;
            text-align: center;
        }

        // ==================== UTILS ====================
        const Utils = {
            // ✅ Sanitize user input to prevent XSS
            escapeHtml: (str) => {
                if (typeof str !== 'string') return str;
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            },
            
            // ✅ Timezone-safe date comparison (YYYY-MM-DD only)
            parseDate: (dateStr) => {
                if (!dateStr) return null;
                const [y, m, d] = dateStr.split('-').map(Number);
                return new Date(y, (m || 1) - 1, d || 1); // Noon UTC to avoid timezone issues
            },
            
            isDateExpired: (dateStr) => {
                const date = Utils.parseDate(dateStr);
                if (!date) return false;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                return date < today;
            },
            
            debounce: (func, wait) => {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },
            
            // ✅ Safe JSON parse with fallback
            safeJsonParse: (str, fallback) => {
                try { return JSON.parse(str); }
                catch { return fallback; }
            },
            
            // ✅ Generate unique ID
            uid: () => Date.now().toString(36) + Math.random().toString(36).substr(2)

        function initFirebase() {
            firebase.initializeApp(CONFIG.firebase);

            db.enablePersistence().catch(err => {

        function login() {
            const email = DOM.loginEmail?.value.trim();
            const password = DOM.loginPassword?.value.trim();
            
            if (DOM.loginError) DOM.loginError.textContent = '';
            
            if (!email) {
                showToast('Isi email.', 'critical');
                if (DOM.loginEmail) DOM.loginEmail.focus();
                return;
            }
            
            // Auto login with Google for admin email
            if (CONFIG.adminEmails.includes(email.toLowerCase())) {
                loginWithGoogle();
                return;
            }

            if (!password) {
                showToast('Isi password.', 'critical');
                if (DOM.loginPassword) DOM.loginPassword.focus();
                return;
            }
            
            auth.signInWithEmailAndPassword(email, password)
                .catch(err => {
                    console.error('Login error:', err);
                    if (DOM.loginError) {
                        let msg = 'Gagal login';
                        if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                            msg = 'Password salah. Silakan coba lagi.';
                        } else if (err.code === 'auth/user-not-found') {
                            msg = 'Email tidak terdaftar.';
                        } else if (err.code === 'auth/invalid-email') {
                            msg = 'Format email tidak valid.';
                        } else if (err.code === 'auth/too-many-requests') {
                            msg = 'Terlalu banyak percobaan. Silakan coba lagi nanti.';
                        } else {
                            msg = 'Gagal: ' + (err.message || 'Unknown error');
                        }
                        DOM.loginError.textContent = msg;
                    }

        }

            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            console.log("Using Firebase Project:", CONFIG.firebase.projectId);
            auth.signInWithPopup(provider)
                .catch(err => {
                    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
                        console.info('Google login popup was closed by user.');
                        showToast('Login dibatalkan. Silakan coba lagi dan selesaikan login Google.', 'warning');

        function generateWebQRCode() {
            const container = document.getElementById('walkinQrContainer');
            if (!container) return;

            container.innerHTML = `
                <div id="walkinQrLoading" style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:240px; height:240px; color:var(--text-muted); font-size:0.85rem; gap:10px;">

                </div>
            `;

            const svgDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(WALKIN_FAVICON_SVG);

            const finishRender = (canvas) => {
                if (!canvas) return;
                canvas.id = 'walkinQrActiveCanvas';
                canvas.style.cssText = 'width:240px; height:240px; display:block; border-radius:12px; max-width:100%; box-shadow:0 4px 12px rgba(15,23,42,0.08);';
                container.innerHTML = '';
                container.appendChild(canvas);
            };

            // 1. Coba gunakan library EasyQRCodeJS jika tersedia
            if (typeof QRCode !== 'undefined') {
                try {
                    const tempDiv = document.createElement('div');
                    new QRCode(tempDiv, {
                        text: WALKIN_WEB_URL,
                        width: 540,
                        height: 540,
                        colorDark: "#0f172a",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H,
                        logo: svgDataUrl,
                        logoWidth: 124,
                        logoHeight: 124,
                        logoBackgroundColor: '#ffffff',
                        logoBackgroundTransparent: false,
                        quietZone: 18,
                        quietZoneColor: '#ffffff',
                        onRenderingEnd: function(options, dataURL) {
                            const canvas = tempDiv.querySelector('canvas');
                            if (canvas) {
                                finishRender(canvas);
                            } else if (dataURL) {
                                const imgCanvas = document.createElement('canvas');
                                imgCanvas.width = 540;
                                imgCanvas.height = 540;
                                const ctx = imgCanvas.getContext('2d');
                                const img = new Image();
                                img.onload = () => {
                                    ctx.drawImage(img, 0, 0);
                                    finishRender(imgCanvas);
                                };
                                img.src = dataURL;
                            }
                        }
                    });

                    // Penanganan fallback cepat jika render selesai sinkron
                    const synCanvas = tempDiv.querySelector('canvas');
                    if (synCanvas) {
                        setTimeout(() => {
                            const activeCanvas = tempDiv.querySelector('canvas');
                            if (activeCanvas && !document.getElementById('walkinQrActiveCanvas')) {
                                finishRender(activeCanvas);
                            }
                        }, 80);
                    }
                    return;
                } catch (e) {
                    console.warn('EasyQRCodeJS error, beralih ke canvas fallback:', e);
                }
            }

            // 2. Fallback Canvas generator jika library CDN terlambat dimuat
            const qrImg = new Image();
            qrImg.crossOrigin = 'anonymous';
            qrImg.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 540;
                canvas.height = 540;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, 540, 540);
                ctx.drawImage(qrImg, 0, 0, 540, 540);

                // Tambahkan logo favicon di bagian tengah dengan badge putih
                const favImg = new Image();
                favImg.onload = () => {
                    const center = 270;
                    const logoSize = 114;
                    const half = logoSize / 2;

                    ctx.save();
                    ctx.shadowColor = 'rgba(15, 23, 42, 0.2)';
                    ctx.shadowBlur = 12;
                    ctx.shadowOffsetY = 3;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(center, center, half + 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#e2e8f0';
                    ctx.stroke();
                    ctx.restore();

                    ctx.drawImage(favImg, center - half, center - half, logoSize, logoSize);
                    finishRender(canvas);
                };
                favImg.src = svgDataUrl;
            };
            qrImg.onerror = () => {
                container.innerHTML = `
                    <div style="text-align:center; padding:18px; color:var(--danger);">
                        <i class="fas fa-exclamation-circle" style="font-size:2rem; margin-bottom:8px;"></i>

        }

        // ==================== FIRESTORE ====================
        function listenToFirestore() {
            if (state.unsubscribe) {
                try { state.unsubscribe(); } catch (e) {}
                state.unsubscribe = null;
            }
            if (state.txnUnsubscribe) {
                try { state.txnUnsubscribe(); } catch (e) {}
                state.txnUnsubscribe = null;
            }

            if (!auth.currentUser) {
                console.warn('listenToFirestore ditunda: Pengguna belum terautentikasi.');
                return;
            }

            // 1. Dengar Lemari Utama (Denah & Keranjang)
            state.unsubscribe = db.collection('shared').doc('data')
                .onSnapshot(doc => {    
                    try {
                        if (doc.exists) processData(doc.data());
                        else initializeDefaultData();
                        renderCurrentTab();
                    } catch (err) {
                        console.error('Firestore sync error:', err);
                        showToast('❌ Gagal sinkronisasi data', 'critical');
                    }
                }, err => {
                    if (err.code === 'permission-denied') {
                        console.warn('Firestore akses shared/data ditolak (izin atau sesi berakhir):', err.message);
                        showToast('❌ Akses database ditolak. Pastikan aturan keamanan Firebase atau login ulang.', 'critical');
                    } else {
                        console.error('Firestore listener error:', err);
                        showToast('❌ Koneksi database error: ' + err.message, 'critical');
                    }
                });

            // 2. Dengar Lemari Transaksi (Muat 300 aktivitas terbaru otomatis)
            state.txnUnsubscribe = db.collection('transactions')
                .orderBy('timestamp', 'desc')
                .limit(300)
                .onSnapshot(snapshot => {
                    const txns = [];
                    snapshot.forEach(doc => txns.push(doc.data()));
                    state.globalTransactions = txns;
                    
                    if (['history', 'rekap', 'search', 'in'].includes(state.currentTab)) {
                        updateNamaDatalist();
                        renderCurrentTab();
                    }
                }, err => {
                    if (err.code === 'permission-denied') {
                        console.warn('Firestore akses transactions ditolak (izin atau sesi berakhir):', err.message);
                    } else {
                        console.error('Firestore transactions listener error:', err);
                    }
                });
        }
        
        function processData(data) {
            let frozen = data.frozen || { sections: getDefaultSections('frozen'), baskets: {} };
            let chiller = data.chiller || { sections: getDefaultSections('chiller'), baskets: {} };
            frozen.sections = convertSectionsToSlotFormat(frozen.sections || {});
            chiller.sections = convertSectionsToSlotFormat(chiller.sections || {});
            
            // ✅ INJEKSI ZONA OVERLOAD (Frozen = 3 Baris, Chiller = 2 Baris)
            if (!frozen.sections['OVERLOAD']) {
                frozen.sections['OVERLOAD'] = { 'A': [null,null,null,null,null], 'B': [null,null,null,null,null], 'C': [null,null,null,null,null] };
            } else if (!frozen.sections['OVERLOAD']['C']) {
                // Jika database lama cuma punya A dan B, tambahkan C tanpa merusak data
                frozen.sections['OVERLOAD']['C'] = [null,null,null,null,null]; 
            }
            
            if (!chiller.sections['OVERLOAD']) {
                chiller.sections['OVERLOAD'] = { 'A': [null,null,null,null,null], 'B': [null,null,null,null,null] };
            }
            
            state.appData.frozen = frozen;
            state.appData.chiller = chiller;
            state.serverVersion = data.version || 0;
            syncBasketsWithSections('frozen');
            syncBasketsWithSections('chiller');
            if (!data.frozen || !data.chiller) saveToFirestore().catch(()=>{});
        }
        
        async function initializeDefaultData() {
            state.appData.frozen = { sections: getDefaultSections('frozen'), baskets: {} };
            state.appData.chiller = { sections: getDefaultSections('chiller'), baskets: {} };
            syncBasketsWithSections('frozen');
            syncBasketsWithSections('chiller');
            try { await saveToFirestore(); } 
            catch (err) { showToast('❌ Gagal membuat data awal. Cek koneksi.', 'critical'); }
        }
        
        async function saveToFirestore() {
            if (state.isSaving) throw new Error('Sedang menyimpan, harap tunggu');
            state.isSaving = true;
            
            const docRef = db.collection('shared').doc('data');
            // Tarik antrean transaksi
            const txnsToSave = [...(state.pendingTransactions || [])];
            state.pendingTransactions = []; // Langsung kosongkan
            
            try {
                // Bersihkan sampah transaksi lama agar file utama tidak bengkak
                if (state.appData.frozen.transactions) delete state.appData.frozen.transactions;
                if (state.appData.chiller.transactions) delete state.appData.chiller.transactions;
                
                await db.runTransaction(async (transaction) => {
                    const doc = await transaction.get(docRef);
                    const serverData = doc.data();

                    if (serverData && serverData.version !== undefined) {
                        if (serverData.version > state.serverVersion) {
                            throw new Error('TABRAKAN_DATA');
                        }
                    }

                    const newVersion = (state.serverVersion || 0) + 1;
                    
                    // 1. Simpan denah & keranjang ke Lemari A
                    transaction.set(docRef, {
                        frozen: state.appData.frozen,
                        chiller: state.appData.chiller,
                        version: newVersion, 
                        lastSync: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    // 2. Simpan setiap aktivitas ke Lemari B (collection 'transactions')
                    txnsToSave.forEach(txn => {
                        const txnRef = db.collection('transactions').doc(txn.id);
                        transaction.set(txnRef, txn);
                    });
                });

                state.serverVersion = (state.serverVersion || 0) + 1;
                return true;

            } catch (err) {
                console.error('Transaction failed:', err);
                if (err.message !== 'TABRAKAN_DATA') {
                    showToast('❌ Gagal simpan: ' + (err.code || err.message), 'critical');
                }

        function syncBasketsWithSections(area) {
            const sections = state.appData[area].sections;
            const baskets = state.appData[area].baskets;
            const validNumbers = new Set();
            
            // Collect all valid basket numbers from sections
            for (const section of Object.values(sections)) {
                for (const slots of Object.values(section)) {
                    slots.forEach(num => { if (num !== null) validNumbers.add(num); });
                }
            }
            
            // Remove orphaned baskets
            for (const num of Object.keys(baskets)) {
                if (!validNumbers.has(Number(num))) {
                    delete baskets[num];
                }
            }
            
            // Update basket metadata from sections
            for (const [sectionName, barisObj] of Object.entries(sections)) {
                for (const [barisName, slots] of Object.entries(barisObj)) {
                    slots.forEach((basketNum, slotIdx) => {
                        if (basketNum === null) return;
                        
                        if (!baskets[basketNum]) {
                            baskets[basketNum] = {
                                section: sectionName,
                                baris: barisName,
                                slot: slotIdx + 1,
                                items: []
                            };
                        } else {
                            // Update location if changed
                            baskets[basketNum].section = sectionName;
                            baskets[basketNum].baris = barisName;
                            baskets[basketNum].slot = slotIdx + 1;
                        }
                    });
                }
            }
        }

        function getDefaultSections(area) {

            return area === 'frozen' ? Utils.safeJsonParse(JSON.stringify(frozen), frozen) : Utils.safeJsonParse(JSON.stringify(chiller), chiller);
        }
        
        function convertSectionsToSlotFormat(sections) {
            const result = {};
            for (const [sectionName, barisObj] of Object.entries(sections || {})) {
                result[sectionName] = {};
                for (const [barisName, value] of Object.entries(barisObj || {})) {
                    // Convert legacy array format to 5-slot array
                    if (Array.isArray(value) && value.length === 5 && value.every(x => x === null || typeof x === 'number')) {
                        result[sectionName][barisName] = value;
                    } else {
                        result[sectionName][barisName] = upgradeBarisToSlots(value);
                    }
                }
            }
            return result;
        }
        
        function upgradeBarisToSlots(baris) {
            if (!Array.isArray(baris)) return [null, null, null, null, null];
            const slots = [null, null, null, null, null];
            baris.forEach((num, idx) => {
                if (idx < 5 && num !== null && num !== undefined) {
                    slots[idx] = num;
                }
            });
            return slots;
        }

        function getBasketCapacity(basketNum) {
            const items = currentBaskets()[basketNum]?.items || [];
            if (items.length === 0) return CONFIG.basketCapacity.DEFAULT;
            return items.some(i => i.jenis === 'TH') 
                ? CONFIG.basketCapacity.MIXED_WITH_TH 
                : CONFIG.basketCapacity.DEFAULT;
        }
        
        function isBasketFull(basketNum) {
            return (currentBaskets()[basketNum]?.items || []).length >= getBasketCapacity(basketNum);

        // ✅ FEFO check - Memberi saran tapi TIDAK memblokir (Bisa di-Bypass)
        function cekFEFO(basketNum, itemIdx, showUI = true) {
            const items = currentBaskets()[basketNum]?.items || [];
            const selectedItem = items[itemIdx];
            if (!selectedItem?.expDate) return true;
            
            const selectedExp = Utils.parseDate(selectedItem.expDate)?.getTime();
            const now = Date.now();
            
            // Cari barang dengan nama sama, exp lebih awal, dan BUKAN retain sample
            const earlierExpiring = items
                .filter((it, i) => i !== itemIdx && it.expDate && !it.isRetainSample)
                .filter(it => {
                    const expTime = Utils.parseDate(it.expDate)?.getTime();
                    return expTime < selectedExp && expTime > now;
                })
                .sort((a, b) => Utils.parseDate(a.expDate) - Utils.parseDate(b.expDate));
            
            if (earlierExpiring.length > 0) {
                const first = earlierExpiring[0];
                if (showUI) {
                    // Gunakan confirm() agar user punya kebebasan memilih
                    const pesan = `⚠️ SARAN PENGAMBILAN:\n\nAda "${first.nama}" dengan Expired lebih awal (${new Date(first.expDate).toLocaleDateString('id-ID')}).\n\nApakah Anda tetap ingin melanjutkan mengambil barang ini (untuk Trial/Riset)?`;
                    
                    return confirm(pesan); // Jika user klik OK (Lanjut), return true. Batal = false.
                }
                return false; 
            }
            return true; // Jika tidak ada exp lebih awal, langsung izinkan
        }

function showToast(message, type = 'normal') {

}

        // ==================== UI BUILDERS - BASKET SLOT ====================
        function buildBasketSlot(basketNum, slotIdx) {
            if (basketNum === null) {
                return '<div class="basket-slot slot-empty" role="gridcell" aria-label="Slot kosong"></div>';
            }
            
            const basket = currentBaskets()[basketNum];
            const items = basket?.items || [];
            const count = items.length;
            const capacity = getBasketCapacity(basketNum);
            
            const cekOverThawing = (tgl) => tgl && (new Date().setHours(0,0,0,0) - new Date(tgl).setHours(0,0,0,0)) / 86400000 > 7;
            const isFull = count >= capacity;
            
            const hasExpired = items.some(i => i.expDate && Utils.isDateExpired(i.expDate) && !i.isRetainSample);
            const hasEstLewat = items.some(i => i.estOutDate && Utils.isDateExpired(i.estOutDate) && !i.isRetainSample);
            const hasOverThawing = basket.section === 'THAWING' && items.some(i => cekOverThawing(i.tglMasuk) && !i.isRetainSample);
            const hasRetain = items.some(i => i.isRetainSample);
            
            let classes = 'basket-slot';
            if (hasExpired || hasEstLewat || hasOverThawing) classes += ' red';
            else if (isFull) classes += ' yellow';
            else if (count > 0) classes += ' green';
            else classes += ' slot-empty';
            
            const icons = [];
            let z = 5;
            if (hasExpired) icons.push(`<span class="status-icon expired" style="z-index:${z--};"><i class="fas fa-skull"></i></span>`);
            if (hasOverThawing) icons.push(`<span class="status-icon expired" style="background:#dc2626; z-index:${z--};"><i class="fas fa-clock"></i></span>`);
            if (hasEstLewat) icons.push(`<span class="status-icon est-lewat" style="z-index:${z--};"><i class="fas fa-hourglass-end"></i></span>`);
            if (isFull) icons.push(`<span class="status-icon full" style="z-index:${z--};"><i class="fas fa-ban"></i></span>`);
            if (hasRetain) icons.push(`<span class="status-icon" style="background:var(--purple); z-index:${z--};"><i class="fas fa-vial"></i></span>`);
            
            const statusIcons = icons.length ? `<div class="slot-status-icons" aria-hidden="true">${icons.join('')}</div>` : '';
            const basketNumBadge = `<div class="basket-num-badge" aria-label="Nomor keranjang ${basketNum}">${basketNum}</div>`;
            const slotCount = `<div class="slot-count">${count}/${capacity}</div>`;
            
            // Tooltip untuk Desktop
            const tips = [`Keranjang ${basketNum} — ${count}/${capacity}`];
            if (isFull) tips.push('🚫 PENUH');
            if (hasExpired) tips.push('☠️ EXPIRED');
            if (hasEstLewat) tips.push('⏳ EST LEWAT');
            if (hasOverThawing) tips.push('⏰ OVER THAWING (>7 HR)');
            if (hasRetain) tips.push('🧪 RETAIN');
            
            return `
                <div class="${classes}" 
                     onclick="App.showBasketDetail(${basketNum})" 
                     title="${Utils.escapeHtml(tips.join(' | '))}"
                     role="button" tabindex="0"
                     aria-label="Keranjang ${basketNum}">
                     
                    <!-- BAGIAN KIRI: Nomor Keranjang -->
                    ${basketNumBadge}
                    
                    <!-- BAGIAN KANAN: Ikon Peringatan & Jumlah Item -->
                    <div style="display:flex; align-items:center; gap:6px;">
                        ${statusIcons}
                        ${slotCount}
                    </div>
                    
                </div>
            `;
        }
        
        function buildBarisBox(sectionName, barisName, slots) {
            const barisLabels = ['A', 'B', 'C', 'D', 'E'];
            const barisIndex = barisLabels.indexOf(barisName) + 1;
            const paddedIndex = String(barisIndex).padStart(2, '0');

        function getSingleBarisBox(sectionName, barisName) {

        }

        function getAreaStats() {
            const baskets = currentBaskets();
            let totalItems = 0, totalExpired = 0, totalEstLewat = 0, totalPenuh = 0, totalRetain = 0;

        function validateQuickEstOut() {
            const expDate = document.getElementById('inExpDate')?.value;
            const estOut = document.getElementById('inEstOutDate')?.value;
            const estInput = document.getElementById('inEstOutDate');
            const warning = document.getElementById('estOutWarning');
            
            if (!expDate || !estOut || !warning) return;
            
            const expD = Utils.parseDate(expDate);
            const estD = Utils.parseDate(estOut);
            
            if (!expD || !estD) return;
            
            if (estD > expD) {
                warning.innerHTML = '<i class="fas fa-exclamation-triangle" aria-hidden="true"></i> ❌ Tidak boleh lebih dari Tanggal Exp!';
                warning.style.color = 'var(--danger)';
                estInput?.classList.add('input-warning');
                estInput?.classList.remove('input-success');
            } else if (estD.getTime() === expD.getTime()) {
                warning.innerHTML = '<i class="fas fa-info-circle" aria-hidden="true"></i> ⚠️ Estimasi sama dengan Exp';
                warning.style.color = 'var(--warning)';
                estInput?.classList.add('input-success');
                estInput?.classList.remove('input-warning');
            } else {
                warning.innerHTML = '<i class="fas fa-check-circle" aria-hidden="true"></i> ✅ Valid';
                warning.style.color = 'var(--success)';
                estInput?.classList.add('input-success');
                estInput?.classList.remove('input-warning');
            }
        }
        
        async function submitQuickAdd(e) {
            e.preventDefault();
            const target = window._quickAddTarget;
            if (!target) return showToast('Data keranjang hilang.', 'critical');
            if (isBasketFull(target.basketNum)) return showToast(`❌ Keranjang ${target.basketNum} sudah penuh!`, 'critical');
            
            const basket = currentBaskets()[target.basketNum];
            if (!basket) return showToast('❌ Keranjang tidak ditemukan.', 'critical');
            
            // Verify location hasn't changed
            if (basket.section !== target.section || basket.baris !== target.baris || basket.slot !== target.slot) {
                return showToast('⚠️ Lokasi keranjang sudah berubah. Silakan refresh.', 'critical');
            }
            
            const nama = document.getElementById('inNama')?.value.trim();
            const qty = document.getElementById('inQty')?.value.trim();
            const jenis = document.getElementById('inJenis')?.value;
            const expDate = document.getElementById('inExpDate')?.value;
            const estOutDate = document.getElementById('inEstOutDate')?.value;
            
            if (!nama || !qty) return showToast('Lengkapi nama dan jumlah!', 'critical');
            if (!expDate || !estOutDate) return showToast('Tanggal Exp dan Estimasi Keluar wajib!', 'critical');
            
            const expD = Utils.parseDate(expDate);
            const estD = Utils.parseDate(estOutDate);
            if (estD > expD) return showToast('❌ Est Keluar tidak boleh > Exp!', 'critical');
            
            // TH mixing rules
            if (jenis === 'TH' && basket.items.some(i => i.jenis !== 'TH')) {
                return showToast('❌ TH tidak bisa dicampur dengan non-TH!', 'critical');
            }
            if (jenis !== 'TH' && basket.items.some(i => i.jenis === 'TH')) {
                return showToast('❌ Non-TH tidak bisa dicampur dengan TH!', 'critical');
            }
            
            const currentUser = auth.currentUser?.email || 'unknown';
            const newItem = {
                nama: Utils.escapeHtml(nama), // Sanitize on save too
                qty: Utils.escapeHtml(qty),
                jenis,
                tglMasuk: new Date().toISOString(),
                addedBy: currentUser
            };
            if (expDate) newItem.expDate = expDate;
            if (estOutDate) newItem.estOutDate = estOutDate;
            
              basket.items.push(newItem);
  basket.lastModifiedBy = currentUser;
  basket.lastModifiedAt = new Date().toISOString();

  // ✅ LOG SEKALI SAJA DI SINI
  logTransaction('in', {
    nama, qty, jenis,
    keranjang: target.basketNum,
    section: target.section,
    baris: target.baris,
    expDate, estOutDate
  });
try {
            await saveToFirestore();
            showToast(`✅ ${nama} ditambahkan ke keranjang ${target.basketNum}`);
            setTimeout(() => showBasketDetail(target.basketNum), 300);
        } catch (err) {
            console.error('Save error:', err);
            
            // ROLLBACK DATA LOKAL: Hapus item yang gagal tersimpan
            const idx = basket.items?.findIndex(i => i.nama === nama && i.qty === qty);
            if (idx > -1) basket.items.splice(idx, 1);
            
            // Hapus log transaksi yang batal
            const txnIdx = currentTransactions().findIndex(t => t.detail.nama === nama && t.type === 'in');
            if (txnIdx > -1) currentTransactions().splice(txnIdx, 1);

            if (err.message === 'TABRAKAN_DATA') {
                showToast('⚠️ Gagal menyimpan karena ada data masuk bersamaan! Form TIDAK dihapus, silakan klik Simpan lagi.', 'critical');
                // Form tetap utuh, user bisa langsung submit ulang
            } else {
                showToast('❌ Gagal menyimpan. Cek koneksi.', 'critical');
            }
        }
    }

function saveEstDate(basketNum, itemIdx) {
  const basket = currentBaskets()[basketNum];
  if (!basket?.items[itemIdx]) return;
  const item = basket.items[itemIdx];
  const expDate = Utils.parseDate(item.expDate);
  const newEst = document.getElementById('editEstDate')?.value?.trim();
  
  if (!newEst) return showToast('Tanggal tidak boleh kosong.', 'critical');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(newEst)) return showToast('Format tanggal tidak valid.', 'critical');
  const newDate = Utils.parseDate(newEst);
  if (!newDate || isNaN(newDate.getTime())) return showToast('Tanggal tidak valid.', 'critical');
  if (expDate && newDate > expDate) return showToast(`❌ Tidak boleh lebih dari Exp.`, 'critical');

  const oldEst = item.estOutDate || '-';
  item.estOutDate = newEst;
  const modalEl = document.getElementById('editEstDate')?.closest('.card')?.parentElement?.parentElement;
  if (modalEl) modalEl.remove();

  logTransaction('edit', { nama: item.nama, qty: item.qty, jenis: item.jenis, keranjang: basketNum, section: basket.section, oldEstOutDate: oldEst, newEstOutDate: newEst });
  saveToFirestore().catch(() => {});
  showToast('✅ Estimasi keluar diperbarui.');
  showBasketDetail(basketNum, itemIdx);
}

        function updateMoveSectionByArea() {

            Object.keys(sections).forEach(sectionName => {
                const value = `${area}:${sectionName}`;
                sectionSelect.innerHTML += `<option value="${Utils.escapeHtml(value)}">${area==='frozen'?'❄️':'🌡️'} ${Utils.escapeHtml(sectionName)}</option>`;
            });
            
            if (Object.keys(sections).length > 0) {
                sectionSelect.value = `${area}:${Object.keys(sections)[0]}`;
                updateMoveBaris();
            }
        }
        
        function updateMoveBaris() {
            const areaSelect = document.getElementById('moveArea');
            const sectionSelect = document.getElementById('moveSection');
            const barisSelect = document.getElementById('moveBaris');
            
            if (!barisSelect) return;
            barisSelect.innerHTML = '<option value="">-- Pilih Baris --</option>';
            
            const area = areaSelect?.value || 'frozen';
            const fullSection = sectionSelect?.value;
            if (!fullSection) return;
            
            const [selectedArea, sectionName] = fullSection.split(':');
            const barisObj = state.appData[selectedArea].sections[sectionName] || {};
            
            Object.keys(barisObj).sort().forEach((barisName, idx) => {
                const paddedIdx = String(idx + 1).padStart(2, '0');
                const label = `${sectionName} ${paddedIdx}`;
                barisSelect.innerHTML += `<option value="${Utils.escapeHtml(barisName)}">${Utils.escapeHtml(label)}</option>`;
            });
            
            updateMoveSlot();
        }

        // FUNGSI BARU: Update Slot untuk Form Pindah (Dengan Blokir Lokasi Sendiri)
        function updateMoveSlot() {
            const areaSelect = document.getElementById('moveArea');
            const sectionSelect = document.getElementById('moveSection');
            const barisSelect = document.getElementById('moveBaris');
            const slotSelect = document.getElementById('moveSlot');
            
            if (!slotSelect) return;
            slotSelect.innerHTML = '<option value="">-- Pilih Slot --</option>';
            
            const area = areaSelect?.value || 'frozen';
            const fullSection = sectionSelect?.value;
            const barisName = barisSelect?.value;
            
            if (!fullSection || !barisName) {
                handleMoveSlotChange();
                return;
            }
            
            const [selectedArea, sectionName] = fullSection.split(':');
            const slots = state.appData[selectedArea].sections[sectionName]?.[barisName];
            if (!slots) return;
            
            // LOGIKA BARU: Cari tahu keranjang sumber (asal) barang ini
            const moveForm = document.querySelector('.move-form');
            const fromBasketNum = moveForm ? parseInt(moveForm.id.split('-')[1]) : null;
            const fromArea = state.currentArea;
            
            for (let i = 0; i < 5; i++) {
                const basketNum = slots[i];
                const slotNum = i + 1;
                
                if (basketNum !== null) {
                    // Slot Terisi
                    const targetBaskets = state.appData[selectedArea].baskets;
                    const count = targetBaskets[basketNum]?.items?.length || 0;
                    const isFull = isBasketFull(basketNum); 
                    
                    // Cek apakah keranjang tujuan adalah keranjang yang sama dengan asal
                    const isSelf = (basketNum === fromBasketNum && selectedArea === fromArea);
                    
                    if (isSelf) {
                        // Kunci dropdown jika itu keranjangnya sendiri
                        slotSelect.innerHTML += `
                            <option value="${slotNum}" disabled>
                                Slot ${slotNum}: Krj ${basketNum} (Lokasi Saat Ini) ⛔
                            </option>
                        `;
                    } else {
                        // Normal
                        slotSelect.innerHTML += `
                            <option value="${slotNum}" ${isFull ? 'disabled' : ''}>
                                Slot ${slotNum}: Krj ${basketNum} (${count} item)${isFull ? ' - PENUH' : ''}
                            </option>
                        `;
                    }
                } else {
                    // Slot Kosong
                    slotSelect.innerHTML += `<option value="${slotNum}">Slot ${slotNum} (kosong)</option>`;
                }
            }
            handleMoveSlotChange();
        }

        // FUNGSI BARU: Trigger penguncian form jika slot penuh/kosong
        function handleMoveSlotChange() {
            const slot = parseInt(document.getElementById('moveSlot')?.value);
            const manualInput = document.getElementById('moveKeranjangBaru');
            const formGroup = manualInput?.closest('.form-group');
            const warning = document.getElementById('moveKeranjangWarning');
            if (warning) warning.remove();
            
            if (!manualInput) return;
            manualInput.classList.remove('input-warning', 'input-success');
            
            if (!slot || isNaN(slot)) {
                manualInput.disabled = true;
                manualInput.placeholder = "Pilih slot dulu";
                manualInput.value = '';
                return;
            }
            
            const areaSelect = document.getElementById('moveArea');
            const sectionSelect = document.getElementById('moveSection');
            const barisSelect = document.getElementById('moveBaris');
            
            const area = areaSelect?.value || 'frozen';
            const fullSection = sectionSelect?.value;
            const barisName = barisSelect?.value;
            const [selectedArea, sectionName] = fullSection.split(':');
            
            const slots = state.appData[selectedArea].sections[sectionName]?.[barisName];
            if (!slots) return;
            
            const basketNum = slots[slot - 1];
            if (basketNum !== null && basketNum !== undefined) {
                // SLOT ADA ISINYA -> Kunci Nomor Baru
                manualInput.disabled = true;
                manualInput.value = '';
                manualInput.placeholder = `Masuk ke Krj ${basketNum}`;
                manualInput.classList.add('input-success');
                
                const info = document.createElement('div');
                info.id = 'moveKeranjangWarning';
                info.className = 'success-message';
                info.innerHTML = `<i class="fas fa-check-circle" aria-hidden="true"></i> Keranjang ${basketNum} siap menerima`;
                formGroup?.appendChild(info);
            } else {
                // SLOT KOSONG -> Buka input Nomor Baru
                manualInput.disabled = false;
                manualInput.placeholder = "⚠️ Nomor keranjang baru (wajib)";
                manualInput.classList.add('input-warning');
                manualInput.focus();
            }
        }
        
        function validateMoveKeranjangBaru() {
            const input = document.getElementById('moveKeranjangBaru');
            const warning = document.getElementById('moveKeranjangWarning');
            if (!input || !warning) return;
            
            const value = input.value.trim();
            warning.textContent = '';
            input.classList.remove('input-warning', 'input-success');
            
            if (!value) return;
            
            const num = parseInt(value);
            if (!num || num <= 0) {
                input.classList.add('input-warning');
                warning.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Nomor tidak valid';
                return;
            }
            
            // Cek target area
            const targetArea = document.getElementById('moveArea')?.value || 'frozen';
            let found = null;
            
            const sections = state.appData[targetArea].sections;
            for (const [secName, barisObj] of Object.entries(sections)) {
                for (const slots of Object.values(barisObj)) {
                    if (slots.includes(num)) {
                        found = { area: targetArea, section: secName };
                        break;
                    }
                }
                if (found) break;
            }
            
            if (found) {
                input.classList.add('input-warning');
                warning.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ❌ Sudah digunakan di ${found.area==='frozen'?'❄️ Frozen':'🌡️ Chiller'} ${found.section}`;
            } else {
                input.classList.add('input-success');
                warning.innerHTML = '<i class="fas fa-check-circle"></i> ✅ Tersedia';
            }
        }
        
        async function pindahkanItem(fromBasketNum, itemIdx) {
            const fromArea = state.currentArea;
            const fromBasket = state.appData[fromArea].baskets[fromBasketNum];
            if (!fromBasket?.items[itemIdx]) return;
            
            const item = fromBasket.items[itemIdx];
            
            // ✅ FEFO check
            if (item.expDate && !cekFEFO(fromBasketNum, itemIdx, true)) {
                return; // Batal jika dilarang FEFO
            }
            
            const targetArea = document.getElementById('moveArea')?.value || 'frozen';
            const fullSection = document.getElementById('moveSection')?.value;
            const targetBaris = document.getElementById('moveBaris')?.value;
            const slotStr = document.getElementById('moveSlot')?.value;
            const manualInput = document.getElementById('moveKeranjangBaru')?.value;
            
            if (!fullSection || !targetBaris || !slotStr) {
                return showToast('Pilih Section, Baris, dan Slot tujuan.', 'critical');
            }
            
            const [sectionArea, targetSection] = fullSection.split(':');
            const targetSlotIdx = parseInt(slotStr) - 1;
            
            const targetSlots = state.appData[targetArea].sections[targetSection]?.[targetBaris];
            if (!targetSlots) return showToast('Data slot tujuan tidak valid.', 'critical');
            
            let targetBasketNum = targetSlots[targetSlotIdx];
            let isNewBasket = false;

            if (targetBasketNum === null || targetBasketNum === undefined) {
                // SLOT KOSONG -> Wajib ambil input manual
                if (!manualInput || isNaN(parseInt(manualInput)) || parseInt(manualInput) <= 0) {
                    return showToast('❌ Masukkan Nomor Keranjang Baru di slot yang kosong!', 'critical');
                }
                targetBasketNum = parseInt(manualInput);
                
                // Cek apakah keranjang tujuan belum dipakai di area tsb
                let isUsed = false;
                for (const barisObj of Object.values(state.appData[targetArea].sections)) {
                    for (const slots of Object.values(barisObj)) {
                        if (slots.includes(targetBasketNum)) isUsed = true;
                    }
                }
                if (isUsed) return showToast(`❌ Nomor ${targetBasketNum} sudah digunakan di ${targetArea}.`, 'critical');
                
                isNewBasket = true;
            } else {
                // SLOT ADA ISINYA -> Cek apakah kepenuhan
                const targetBaskets = state.appData[targetArea].baskets;
                const targetBasketData = targetBaskets[targetBasketNum];
                if (targetBasketData) {
                    const capacity = targetBasketData.items.some(i => i.jenis === 'TH') || item.jenis === 'TH' 
                        ? CONFIG.basketCapacity.MIXED_WITH_TH 
                        : CONFIG.basketCapacity.DEFAULT;
                    
                    if (targetBasketData.items.length >= capacity) {
                        return showToast(`❌ Keranjang tujuan (${targetBasketNum}) penuh!`, 'critical');
                    }
                }
            }
            
            if (targetBasketNum === fromBasketNum && targetArea === fromArea) {
                return showToast('❌ Tidak bisa pindah ke keranjang yang sama.', 'critical');
            }
            
            // --- EKSEKUSI PINDAH ---
            const currentUser = auth.currentUser?.email || 'unknown';
            
            item.moveHistory = item.moveHistory || [];
            item.moveHistory.push({
                from: `Krj ${fromBasketNum} (${fromArea.toUpperCase()})`,
                to: `Krj ${targetBasketNum} (${targetArea.toUpperCase()})`,
                timestamp: new Date().toISOString(),
                user: currentUser
            });
            
            fromBasket.items.splice(itemIdx, 1);
            if (fromBasket.items.length === 0) {
                removeEmptyBasketNumber(fromBasketNum, fromArea);
            }
            
            if (isNewBasket) {
                targetSlots[targetSlotIdx] = targetBasketNum;
                state.appData[targetArea].baskets[targetBasketNum] = {
                    section: targetSection,
                    baris: targetBaris,
                    slot: targetSlotIdx + 1,
                    items: []
                };
            }
            state.appData[targetArea].baskets[targetBasketNum].items.push(item);
            
            logTransaction('move', {
                nama: item.nama,
                qty: item.qty,
                jenis: item.jenis,
                dari: fromBasketNum,
                ke: targetBasketNum,
                section: targetSection,
                areaTujuan: targetArea
            });
            
            try {
                await saveToFirestore();
                showToast(`✅ Barang dipindahkan ke keranjang ${targetBasketNum}`);
                
                // Jika pindah lintas area, kembalikan posisi layar ke sumber agar nyaman
                if (state.currentArea !== fromArea) {
                    state.currentArea = fromArea;
                    DOM.areaSelect.value = fromArea;
                    DOM.areaTitle.textContent = fromArea === 'frozen' ? 'Frozen' : 'Chiller';
                }
                showBasketDetail(fromBasketNum);
            } catch {
                showToast('❌ Gagal memindahkan barang.', 'critical');
            }
        }
        
        function removeEmptyBasketNumber(basketNum, area) {
            if (!area) area = state.currentArea; // Pastikan hanya menghapus di area saat ini
            
            const sections = state.appData[area].sections;
            const baskets = state.appData[area].baskets;
            
            for (const [sectionName, barisObj] of Object.entries(sections)) {
                for (const [barisName, slots] of Object.entries(barisObj)) {
                    const idx = slots.indexOf(basketNum);
                    if (idx !== -1) {
                        slots[idx] = null;
                        if (baskets[basketNum]) {
                            delete baskets[basketNum];
                        }
                        return; // Ketemu dan berhasil dihapus
                    }
                }
            }
        }
        

        // ==================== KELUARKAN ITEM ====================
        function keluarkanItem(basketNum, itemIdx) {
            const basket = currentBaskets()[basketNum];
            if (!basket?.items[itemIdx]) return;
            
            const item = basket.items[itemIdx];
            
            // ✅ FEFO blocking check
            if (item.expDate && !cekFEFO(basketNum, itemIdx, true)) {
                return;
            }
            
            const qty = parseFloat(item.qty) || parseInt(item.qty) || 0;
            if (!isNaN(qty) && qty > 1) {
                showPartialOutDialog(basketNum, itemIdx, item, qty);
            } else {
                if (confirm(`Keluarkan "${item.nama}" dari keranjang ${basketNum}?`)) {
                    executeFullOut(basketNum, itemIdx, item);
                }
            }
        }
        
        function showPartialOutDialog(basketNum, itemIdx, item, totalQty) {
            const safeName = item.nama.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const safeJenis = (item.jenis || '').replace(/'/g, "\\'");
            
            const dialog = document.createElement('div');
            dialog.id = 'partialOutDialog';
            dialog.innerHTML = `
                <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;" 
                     onclick="App.closePartialOutDialog()" role="dialog" aria-modal="true" aria-labelledby="partialOutTitle">
                    <div class="card" style="width:100%;max-width:400px;" onclick="event.stopPropagation();">
                        <h3 id="partialOutTitle">📤 Keluarkan Sebagian</h3>
                        <div style="background:#f0f4ff;border-radius:8px;padding:12px;margin-bottom:16px;">
                            <strong>${Utils.escapeHtml(item.nama)}</strong><br>
                            Total: <strong>${totalQty}</strong>
                        </div>
                        <label for="partialOutQty">Jumlah yang dikeluarkan</label>
                        <input type="number" id="partialOutQty" min="1" max="${totalQty}" 
                               placeholder="Masukkan jumlah" 
                               style="font-size:1.2rem;text-align:center;width:100%;margin:8px 0;"
                               onkeypress="if(event.key==='Enter')App.executePartialOut(${basketNum},${itemIdx},'${safeName}',${totalQty},'${safeJenis}')"
                               aria-label="Jumlah barang yang akan dikeluarkan">
                        <small id="partialOutWarning" style="display:block;margin-bottom:8px;" role="status"></small>
                        <div style="display:flex;gap:8px;">
                            <button class="btn btn-outline" style="flex:1;" onclick="App.closePartialOutDialog()" aria-label="Batal">Batal</button>
                            <button class="btn" style="flex:1;background:#ef4444;color:white;" 
                                    onclick="App.executePartialOut(${basketNum},${itemIdx},'${safeName}',${totalQty},'${safeJenis}')"
                                    aria-label="Konfirmasi keluarkan">Keluarkan</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(dialog);
            
            // Focus input
            setTimeout(() => {
                document.getElementById('partialOutQty')?.focus();
            }, 100);
        }
        
        function executePartialOut(basketNum, itemIdx, itemName, totalQty, jenis) {
            const qtyInput = document.getElementById('partialOutQty');
            const qtyOut = parseInt(qtyInput?.value);
            const warning = document.getElementById('partialOutWarning');
            
            if (!qtyOut || qtyOut <= 0) {
                if (warning) warning.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Masukkan jumlah!';
                return;
            }
            if (qtyOut > totalQty) {
                if (warning) warning.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Maksimal ${totalQty}!`;
                return;
            }
            
            const basket = currentBaskets()[basketNum];
            if (!basket?.items[itemIdx]) return;
            
            const sisa = totalQty - qtyOut;
            if (sisa <= 0) {
                // Remove entirely
                executeFullOut(basketNum, itemIdx, basket.items[itemIdx]);
                closePartialOutDialog();
                return;
            }
            
            // Update quantity
            const currentUser = auth.currentUser?.email || 'unknown';
            basket.items[itemIdx].qty = sisa.toString();
            basket.lastModifiedBy = currentUser;
            basket.lastModifiedAt = new Date().toISOString();
            
            logTransaction('out', {
                nama: itemName,
                qty: `${qtyOut} dari ${totalQty} (sisa ${sisa})`,
                jenis,
                keranjang: basketNum,
                section: basket.section,
                partial: true
            });
            
            saveToFirestore().catch(() => {});
            closePartialOutDialog();
            showToast(`✅ ${qtyOut} ${itemName} dikeluarkan. Sisa: ${sisa}`);
            showBasketDetail(basketNum);
        }
        
        async function executeFullOut(basketNum, itemIdx, item) {
            const basket = currentBaskets()[basketNum];
            if (!basket) return;
            
            const currentUser = auth.currentUser?.email || 'unknown';
            basket.items.splice(itemIdx, 1);
            
            if (basket.items.length === 0) {
                removeEmptyBasketNumber(basketNum);
            } else {
                basket.lastModifiedBy = currentUser;
                basket.lastModifiedAt = new Date().toISOString();
            }
            
            logTransaction('out', {
                nama: item.nama,
                qty: item.qty,
                jenis: item.jenis,
                keranjang: basketNum,
                section: basket.section
            });
            
            try {
                await saveToFirestore();
                showToast(`✅ ${item.nama} dikeluarkan`);
                showBasketDetail(basketNum);
            } catch {
                // Error handled by saveToFirestore
            }
        }
        
        function closePartialOutDialog() {
            document.getElementById('partialOutDialog')?.remove();
        }
